nd.android.package-archive'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='KingDrive-Sabara.apk';a.rel='noopener';document.body.appendChild(a);document.getElementById('downloadBtn').style.display='block';document.getElementById('downloadBtn').onclick=()=>a.click();a.click();setStatus('Download iniciado. Abrindo grupo do WhatsApp…');setTimeout(()=>{location.href=WHATS},2500)}catch(e){setStatus('Não foi possível iniciar automaticamente. Use os botões abaixo.');console.error(e)}}run();</script></body></html>
