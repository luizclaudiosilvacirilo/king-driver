<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6a000"><title>King Driver — Download</title><style>body{margin:0;background:#111;color:#fff;font-family:system-ui,sans-serif}.box{max-width:520px;margin:auto;padding:28px 20px;text-align:center}.logo{width:82px;height:82px;border-radius:24px;background:#f6a000;color:#111;display:grid;place-items:center;margin:10px auto 18px;font-size:42px;font-weight:900}.card{background:#1c1c1c;border:1px solid #333;border-radius:24px;padding:22px;margin-top:18px}.btn{display:block;width:100%;padding:15px;border:0;border-radius:14px;font-weight:900;font-size:16px;margin:10px 0;text-decoration:none;box-sizing:border-box}.download{background:#f6a000;color:#111}.open{background:#222;color:#fff;border:1px solid #444}.muted{color:#bbb;font-size:14px;line-height:1.5}.status{font-weight:800;color:#f6a000}</style></head><body><main class="box"><div class="logo">K</div><h1>King Driver Sabará</h1><p class="muted">Aplicativo de mobilidade urbana para Sabará.</p><div class="card"><p id="status" class="status">Preparando download…</p><a class="btn download" id="download" href="#">Baixar APK King Driver Sabará</a><a class="btn open" href="auth.html">Abrir aplicativo</a><p class="muted">Depois do download, abra o APK e permita a instalação quando o Android solicitar.</p></div></main><script>const APK_B64='https://raw.githubusercontent.com/luizclaudiosilvacirilo/king-driver/main/KingDrive-Sabara.apk.b64';const status=document.getElementById('status'),button=document.getElementById('download');function bytes(b64){b64=b64.replace(/\s/g,'');const bin=atob(b64),out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out}async function prepare(){try{status.textContent='Verificando APK publicado…';const r=await fetch(APK_B64,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const b64=await r.text();const blob=new Blob([bytes(b64)],{type:'application/vnd.android.package-archive'});const url=URL.createObjectURL(blob);button.href=url;button.download='KingDrive-Sabara.apk';status.textContent='APK pronto para download.'}catch(e){status.textContent='APK ainda não está publicado. O botão ficará disponível após a conclusão do build.';button.removeAttribute('href');console.error(e)}}button.addEventListener('click',e=>{if(!button.href||button.href.endsWith('#'))e.preventDefault()});prepare();</script></body></html>
