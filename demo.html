<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>King Driver — Teste</title><style>body{margin:0;background:#090909;color:#fff;font-family:system-ui,-apple-system,sans-serif}.app{max-width:560px;margin:auto;padding:18px}.brand{text-align:center;font-size:28px;font-weight:900;margin:12px}.brand span{color:#d4af37}.card{background:#151515;border:1px solid #292929;border-radius:16px;padding:16px;margin:12px 0}input,select,button{width:100%;padding:13px;margin:7px 0;box-sizing:border-box;border-radius:10px;border:1px solid #333;background:#0d0d0d;color:#fff;font-size:16px}button{font-weight:800}.gold{background:#d4af37;color:#111;border:0}.muted{color:#aaa;font-size:13px}.price{font-size:28px;color:#d4af37;font-weight:900}.ride{border:1px solid #333;border-radius:12px;padding:12px;margin:8px 0}.ok{color:#54db8d}.top{display:flex;justify-content:space-between;align-items:center}.top button{width:auto;padding:8px 12px}.hidden{display:none}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pill{padding:10px;text-align:center;border:1px solid #333;border-radius:10px;cursor:pointer}.active{border-color:#d4af37}.danger{background:#3b1818;color:#ff9999}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}</style></head><body><div class="app"><div class="brand">♛ KING <span>DRIVER</span></div><div id="app"></div></div><script>
const S=()=>JSON.parse(localStorage.getItem('kd')||'{}');const save=x=>localStorage.setItem('kd',JSON.stringify(x));let state=S();let mode=state.mode||'passenger';let rides=state.rides||[];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){if(!state.user){document.getElementById('app').innerHTML=`<div class="card"><h2>Entrar no King Driver</h2><input id="name" placeholder="Seu nome"><input id="email" type="email" placeholder="E-mail"><select id="role"><option value="passenger">Passageiro</option><option value="driver">Motorista</option></select><button class="gold" onclick="login()">Entrar para testar</button><div class="muted">Versão de demonstração para testes. Os dados ficam somente neste aparelho.</div></div>`;return}document.getElementById('app').innerHTML=`<div class="top"><div><b>Olá, ${esc(state.user.name)}</b><div class="muted">Modo ${state.user.role==='driver'?'motorista':'passageiro'}</div></div><button onclick="logout()">Sair</button></div><div class="tabs"><div class="pill ${mode==='passenger'?'active':''}" onclick="mode='passenger';render()">Passageiro</div><div class="pill ${mode==='driver'?'active':''}" onclick="mode='driver';render()">Motorista</div></div>${mode==='driver'?driver():passenger()}<div id="msg"></div>`}
function passenger(){return `<div class="card"><h2>Solicitar corrida</h2><input id="origin" placeholder="Origem" value="São Sebastião do Paraíso, MG"><input id="dest" placeholder="Destino"><select id="cat"><option>Econômico</option><option>Conforto</option><option>Premium</option></select><input id="fare" type="number" min="1" value="18.50"><button class="gold" onclick="requestRide()">Solicitar corrida</button></div><div class="card"><h3>Minhas corridas</h3>${rides.filter(r=>r.passenger===state.user.email).map(ride).join('')||'<div class="muted">Nenhuma corrida solicitada.</div>'}</div>`}
function driver(){return `<div class="card"><h2>Central do motorista</h2><input id="car" placeholder="Veículo" value="Honda CG 160"><input id="plate" placeholder="Placa"><div class="grid"><input id="color" placeholder="Cor"><input id="year" type="number" placeholder="Ano" value="2024"></div><button class="gold" onclick="toggleOnline()">${state.online?'Ficar offline':'Ficar online'}</button><div class="muted">${state.online?'Você está online e pronto para receber corridas.':'Ative o modo online para simular atendimento.'}</div></div><div class="card"><h3>Corridas disponíveis</h3>${rides.filter(r=>r.status==='requested').map(ride).join('')||'<div class="muted">Nenhuma corrida disponível.</div>'}</div><div class="card"><h3>Minhas corridas</h3>${rides.filter(r=>r.driver===state.user.email).map(ride).join('')||'<div class="muted">Nenhuma corrida aceita.</div>'}</div>`}
function ride(r){let a='';if(mode==='driver'&&r.status==='requested')a=`<button class="gold" onclick="accept('${r.id}')">Aceitar corrida</button>`;if(mode==='driver'&&r.driver===state.user.email){if(r.status==='accepted')a=`<button onclick="advance('${r.id}','arriving')">Estou a caminho</button>`;else if(r.status==='arriving')a=`<button onclick="advance('${r.id}','in_progress')">Iniciar corrida</button>`;else if(r.status==='in_progress')a=`<button class="gold" onclick="advance('${r.id}','completed')">Finalizar corrida</button>`}if(mode==='passenger'&&r.passenger===state.user.email&&['requested','accepted','arriving'].includes(r.status))a=`<button class="danger" onclick="advance('${r.id}','cancelled')">Cancelar</button>`;return `<div class="ride"><b>${esc(r.origin)}</b> → <b>${esc(r.dest)}</b><div class="muted">${esc(r.cat)} · ${esc(r.status)}</div><div class="price">R$ ${Number(r.fare).toFixed(2)}</div>${a}</div>`}
function login(){const name=document.getElementById('name').value.trim(),email=document.getElementById('email').value.trim().toLowerCase(),role=document.getElementById('role').value;if(!name||!email){alert('Informe nome e e-mail.');return}state={...state,user:{name,email,role},mode:role,online:false,rides};save(state);render()}
function logout(){state={rides};save(state);render()}
function requestRide(){const o=document.getElementById('origin').value.trim(),d=document.getElementById('dest').value.trim(),f=Number(document.getElementById('fare').value),c=document.getElementById('cat').value;if(!o||!d||!f){alert('Preencha origem, destino e valor.');return}rides=[{id:Date.now().toString(),passenger:state.user.email,origin:o,dest:d,cat:c,fare:f,status:'requested',driver:''},...rides];state.rides=rides;save(state);render();}
function accept(id){const r=rides.find(x=>x.id===id);if(r){r.driver=state.user.email;r.status='accepted';state.rides=rides;save(state);render()}}
function advance(id,status){const r=rides.find(x=>x.id===id);if(r){r.status=status;state.rides=rides;save(state);render()}}
function toggleOnline(){state.online=!state.online;save(state);render()}
render();</script></body></html>
