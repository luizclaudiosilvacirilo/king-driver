<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>King Driver — Acesso</title><style>body{font-family:system-ui;background:#090909;color:#fff;max-width:460px;margin:0 auto;padding:28px 20px}input,button,select{width:100%;padding:14px;margin:8px 0;box-sizing:border-box;border-radius:10px;border:1px solid #333;background:#151515;color:#fff}button{cursor:pointer;font-weight:800}.gold{background:#d4af37;color:#111;border:0}.msg{padding:12px;margin:12px 0;border-radius:10px;background:#171717;color:#bbb}.secondary{background:#222}.hint{font-size:13px;color:#999;line-height:1.4}</style></head><body><h1>♛ KING DRIVER</h1><p>Entre ou crie sua conta.</p><div id="message" class="msg">Conectado ao sistema.</div><label>Nome completo</label><input id="full_name" autocomplete="name" placeholder="Seu nome"><label>Telefone</label><input id="phone" type="tel" autocomplete="tel" placeholder="(00) 00000-0000"><label>E-mail</label><input id="email" type="email" autocomplete="email" placeholder="seu@email.com"><label>Senha</label><input id="password" type="password" minlength="6" autocomplete="new-password" placeholder="Mínimo 6 caracteres"><label>Perfil</label><select id="role"><option value="passenger">Passageiro</option><option value="driver">Motorista</option></select><button class="gold" id="magic_link">Enviar link de autorização por e-mail</button><div class="hint">O King Driver mostrará claramente para qual endereço o link foi solicitado.</div><button class="gold" id="signup">Criar conta</button><button class="secondary" id="resend" hidden>Reenviar e-mail de confirmação</button><button class="secondary" id="login">Entrar com senha</button><script type="module" src="js/auth.js"></script></body></html>
