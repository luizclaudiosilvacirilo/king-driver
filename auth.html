<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>King Driver — Acesso</title><style>body{font-family:system-ui;background:#090909;color:#fff;max-width:520px;margin:0 auto;padding:24px 18px}input,button,select{width:100%;padding:14px;margin:7px 0;box-sizing:border-box;border-radius:12px;border:1px solid #333;background:#151515;color:#fff}button{cursor:pointer;font-weight:800}.gold{background:#d4af37;color:#111;border:0}.green{background:#1faa59;color:#fff;border:0}.msg{padding:12px;margin:12px 0;border-radius:10px;background:#171717;color:#bbb}.secondary{background:#222}.hint{font-size:13px;color:#999;line-height:1.4}.qrbox{margin-top:18px;padding:16px;background:#171717;border:1px solid #333;border-radius:20px;text-align:center}.qrbox img{width:210px;height:210px;max-width:100%;background:#fff;padding:6px;border-radius:12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}</style></head><body><h1>♛ KING DRIVER</h1><p>Entre ou crie sua conta.</p><div id="message" class="msg">Conectado ao sistema.</div><label>Nome completo</label><input id="full_name" autocomplete="name" placeholder="Seu nome"><label>Telefone</label><input id="phone" type="tel" autocomplete="tel" placeholder="(00) 00000-0000"><label>E-mail</label><input id="email" type="email" autocomplete="email" placeholder="seu@email.com"><label>Senha</label><input id="password" type="password" minlength="6" autocomplete="new-password" placeholder="Mínimo 6 caracteres"><label>Perfil</label><select id="role"><option value="passenger">Passageiro</option><option value="driver">Motorista</option></select><button class="gold" id="magic_link">Enviar link de autorização por e-mail</button><div class="hint">O King Driver mostrará claramente para qual endereço o link foi solicitado.</div><button class="gold" id="signup">Criar conta</button><button class="secondary" id="resend" hidden>Reenviar e-mail de confirmação</button><button class="secondary" id="login">Entrar com senha</button><div class="qrbox"><h2>📲 Baixe o King Driver</h2><p class="hint">Aponte a câmera para o QR Code. Depois do download, entre no grupo de motoristas.</p><img id="appqr" alt="QR Code para baixar o King Driver"><div class="actions"><button class="gold" onclick="location.href='download.html'">Baixar agora</button><button class="green" onclick="location.href='https://chat.whatsapp.com/HzR4gpT00oCAA9Jy4FebvV'">WhatsApp</button></div><p class="hint"><a href="qr.html" style="color:#d4af37">Ver os dois QR Codes</a></p></div><script>const u=new URL('download.html',location.href).href;document.getElementById('appqr').src='https://api.qrserver.com/v1/create-qr-code/?size=300x300&data='+encodeURIComponent(u);</script><script type="module" src="js/auth.js"></script></body></html>
