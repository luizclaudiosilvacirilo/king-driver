<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#d4af37"><title>King Drive Sabará</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:Arial,sans-serif;background:#080808;color:#fff}main{max-width:480px;margin:auto;padding:22px}.brand{text-align:center;font-size:28px;font-weight:900;color:#d4af37;margin:18px 0 24px}.card{background:#151515;border:1px solid #292929;border-radius:18px;padding:18px;margin:12px 0}input,select,button{width:100%;box-sizing:border-box;padding:14px;margin:7px 0;border-radius:10px;border:1px solid #444;background:#0e0e0e;color:#fff}button{background:#d4af37;color:#000;border:0;font-weight:800;cursor:pointer}.secondary{background:#222;color:#fff}.muted{color:#aaa;font-size:13px}.hidden{display:none}.ride{border-top:1px solid #333;padding:12px 0}.ok{color:#73e6a3}.err{color:#ff8b8b}</style></head><body><main><div class="brand">👑 KING DRIVE SABARÁ</div><div id="status" class="muted"></div><section id="auth" class="card"><h2>Entrar</h2><input id="email" type="email" placeholder="E-mail"><input id="password" type="password" placeholder="Senha"><select id="role"><option value="passenger">Passageiro</option><option value="driver">Motorista</option></select><button onclick="login()">ENTRAR</button><button class="secondary" onclick="signup()">CRIAR CONTA</button></section><section id="app" class="hidden"><div class="card"><b id="welcome"></b><button class="secondary" onclick="logout()">Sair</button></div><div id="passenger" class="hidden"><div class="card"><h2>Solicitar corrida</h2><input id="origin" placeholder="Origem em Sabará"><input id="destination" placeholder="Destino"><input id="price" type="number" step="0.01" placeholder="Valor da corrida (R$)"><button onclick="requestRide()">SOLICITAR CORRIDA</button></div><div class="card"><h3>Minhas corridas</h3><div id="myrides"></div></div></div><div id="driver" class="hidden"><div class="card"><h2>Corridas disponíveis</h2><div id="openrides"></div></div><div class="card"><h3>Minhas corridas</h3><div id="driverrides"></div></div></div></section></main><script>const SB_URL='https://zfsvctjqljxchxbnuvui.supabase.co';const SB_KEY='sb_publishable_17rKbweYH7V1E0C0-TPivg_8w4hUx5A';const sb=supabase.createClient(SB_URL,SB_KEY);let profile=null;const $=id=>document.getElementById(id);function msg(t,err=false){$('status').textContent=t;$('status').className=err?'err':'ok'}async function signup(){const email=$('email').value.trim(),password=$('password').value,role=$('role').value;if(!email||password.length<6)return msg('Informe e-mail e senha com pelo menos 6 caracteres.',true);const {data,error}=await sb.auth.signUp({email,password});if(error)return msg(error.message,true);if(data.user){const {error:e}=await sb.from('profiles').insert({id:data.user.id,full_name:email.split('@')[0],role});if(e)return msg(e.message,true)}msg('Conta criada. Se o projeto exigir confirmação de e-mail, confirme e depois entre.')}async function login(){const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return msg(error.message,true);await load()}async function load(){const {data,error}=await sb.from('profiles').select('*').eq('id',(await sb.auth.getUser()).data.user.id).single();if(error)return msg(error.message,true);profile=data;$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('welcome').textContent='Olá, '+data.full_name+' · '+(data.role==='driver'?'Motorista':'Passageiro');$('passenger').classList.toggle('hidden',data.role!=='passenger');$('driver').classList.toggle('hidden',data.role!=='driver');data.role==='driver'?loadDriver():loadPassenger()}async function requestRide(){const origin=$('origin').value.trim(),destination=$('destination').value.trim(),price=Number($('price').value);if(!origin||!destination||price<=0)return msg('Preencha origem, destino e valor.',true);const {error}=await sb.from('rides').insert({passenger_id:profile.id,origin,destination,price,status:'requested'});if(error)return msg(error.message,true);msg('Corrida solicitada!');$('origin').value='';$('destination').value='';$('price').value='';loadPassenger()}async function loadPassenger(){const {data,error}=await sb.from('rides').select('*').eq('passenger_id',profile.id).order('created_at',{ascending:false});if(error)return msg(error.message,true);$('myrides').innerHTML=data.map(r=>`<div class="ride"><b>${r.origin} → ${r.destination}</b><br>R$ ${Number(r.price).toFixed(2)} · <span class="ok">${r.status}</span></div>`).join('')||'<span class="muted">Nenhuma corrida.</span>'}async function loadDriver(){const {data,error}=await sb.from('rides').select('*').or('driver_id.is.null,driver_id.eq.'+profile.id).order('created_at',{ascending:false});if(error)return msg(error.message,true);$('openrides').innerHTML=data.filter(r=>r.driver_id===null&&r.status==='requested').map(r=>`<div class="ride"><b>${r.origin} → ${r.destination}</b><br>R$ ${Number(r.price).toFixed(2)}<button onclick="acceptRide('${r.id}')">ACEITAR</button></div>`).join('')||'<span class="muted">Nenhuma corrida disponível.</span>';$('driverrides').innerHTML=data.filter(r=>r.driver_id===profile.id).map(r=>`<div class="ride"><b>${r.origin} → ${r.destination}</b><br>R$ ${Number(r.price).toFixed(2)} · ${r.status}</div>`).join('')||'<span class="muted">Nenhuma corrida aceita.</span>'}async function acceptRide(id){const {error}=await sb.from('rides').update({driver_id:profile.id,status:'accepted',accepted_at:new Date().toISOString()}).eq('id',id).is('driver_id',null);if(error)return msg(error.message,true);msg('Corrida aceita!');loadDriver()}async function logout(){await sb.auth.signOut();profile=null;$('app').classList.add('hidden');$('auth').classList.remove('hidden');msg('Você saiu.')}sb.auth.onAuthStateChange((event,session)=>{if(session&&!profile)setTimeout(load,0)});</script></body></html>
