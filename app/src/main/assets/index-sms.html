<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>King Driver Sabará</title><style>body{font-family:system-ui;margin:0;background:#111;color:#222}.box{max-width:480px;margin:40px auto;background:#fff;border-radius:22px;padding:24px}input,select,button{width:100%;box-sizing:border-box;padding:13px;margin:7px 0;border-radius:11px;border:1px solid #ddd}button{background:#f6a000;color:#fff;border:0;font-weight:800}.msg{padding:12px;background:#fff7df;border-radius:10px;margin:10px 0}</style></head><body><div class="box"><h1>♛ KING DRIVER</h1><p>Sabará • acesso por SMS</p><select id="role"><option value="passenger">Passageiro</option><option value="driver">Motorista</option></select><input id="name" placeholder="Nome completo"><input id="phone" type="tel" placeholder="(31) 99999-9999"><button onclick="send()">ENVIAR CÓDIGO POR SMS</button><div id="otpBox" hidden><input id="otp" inputmode="numeric" maxlength="10" placeholder="Código recebido por SMS"><button onclick="verify()">CONFIRMAR CÓDIGO</button></div><div id="msg" class="msg">A confirmação é feita por SMS. Não depende de e-mail.</div></div><script src="config.js"></script><script>const U=window.KING_DRIVER_SUPABASE_URL,K=window.KING_DRIVER_SUPABASE_PUBLISHABLE_KEY,$=id=>document.getElementById(id);function ph(v){let d=String(v||'').replace(/\D/g,'');if(d.startsWith('55'))return'+'+d;if(d.length===10||d.length===11)return'+55'+d;throw Error('Informe um celular com DDD.')}async function call(p,o={}){let r=await fetch(U+p,{...o,headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||d.msg||d.error_description||'Falha na operação.');return d}async function send(){try{let phone=ph($('phone').value),name=$('name').value.trim();if(!name)throw Error('Informe seu nome.');sessionStorage.setItem('kd_phone',phone);sessionStorage.setItem('kd_role',$('role').value);await call('/auth/v1/otp',{method:'POST',body:JSON.stringify({phone,create_user:true,data:{role:$('role').value,full_name:name,phone}})});$('otpBox').hidden=false;$('msg').textContent='Código enviado por SMS para '+phone+'.'}catch(e){$('msg').textContent=e.message}}async function verify(){try{let phone=sessionStorage.getItem('kd_phone'),token=$('otp').value.trim();if(!/^\d{6,10}$/.test(token))throw Error('Digite o código SMS.');let d=await call('/auth/v1/verify',{method:'POST',body:JSON.stringify({phone,token,type:'sms'})});if(!d.access_token)throw Error('SMS confirmado, mas a sessão não foi criada.');sessionStorage.setItem('kd_token',d.access_token);if(d.refresh_token)sessionStorage.setItem('kd_refresh',d.refresh_token);$('msg').textContent='SMS confirmado. Acesso liberado.';setTimeout(()=>location.href='index.html',500)}catch(e){$('msg').textContent=e.message}}</script></body></html>
