<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111"><title>King Driver Sabará</title><style>body{margin:0;background:#111;color:#111;font-family:system-ui,sans-serif}.app{max-width:560px;margin:auto;min-height:100vh;background:#f5f4f1}.top{padding:14px 16px;background:#111;color:#fff;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900}.pill{background:#333;border-radius:99px;padding:7px 10px;font-size:11px}.panel{padding:16px}.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #0001}.field{margin:10px 0}.field label{display:block;font-size:11px;font-weight:900;color:#666;margin-bottom:4px}.field input,.field select{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ddd;border-radius:11px}.btn{width:100%;padding:13px;border:0;border-radius:12px;background:#f6a000;color:#fff;font-weight:900;margin-top:8px}.btn.alt{background:#eee;color:#222}.muted{color:#777;font-size:12px}.msg{padding:11px;border-radius:10px;background:#fff7df;margin-top:10px;font-size:12px}.ride{border:1px solid #eee;border-left:5px solid #f6a000;border-radius:12px;padding:12px;margin:9px 0}.login{min-height:100vh;background:linear-gradient(160deg,#111,#292929);padding:22px;box-sizing:border-box;display:flex;align-items:center}.loginbox{background:#fff;border-radius:24px;padding:20px;width:100%}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.nav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}.nav button{padding:12px;border:0;border-radius:12px;background:#fff;font-weight:900}.danger{color:#b52c24}</style></head><body><div id="app"></div><script>const URL='https://zfsvctjqljxchxbnuvui.supabase.co',KEY='sb_publishable_17rKbweYH7V1E0C0-TPivg_8w4hUx5A',TK='kd_token',RK='kd_role';let me=null,profile=null,role='passenger',watch=null;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function token(){return sessionStorage.getItem(TK)||''}function uid(t){try{const p=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(atob(p)).sub||''}catch(_){return''}}async function api(path,opt={}){const t=opt.accessToken||token()||KEY;const r=await fetch(URL+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+t,'Content-Type':'application/json',...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||d.msg||d.error_description||d.error||'Falha na operação.');return d}function loginView(message=''){document.getElementById('app').innerHTML=`<div class="login"><div class="loginbox"><h1 style="text-align:center">♛ KING DRIVER</h1><p class="muted" style="text-align:center">Sabará • Minas Gerais</p><div class="field"><label>PERFIL</label><select id="role"><option value="passenger">Passageiro</option><option value="driver">Motorista</option></select></div><div class="field"><label>NOME</label><input id="name" placeholder="Nome completo"></div><div class="field"><label>E-MAIL</label><input id="email" type="email" placeholder="voce@email.com"></div><div class="field"><label>SENHA</label><input id="pass" type="password" placeholder="Mínimo 6 caracteres"></div><button class="btn" onclick="signup()">Criar conta</button><button class="btn alt" onclick="login()">Entrar</button><div class="msg">${esc(message||'Se a confirmação de e-mail estiver ativa, confirme o e-mail antes de entrar.')}</div></div></div>`}async function signup(){try{role=$('role').value;const email=$('email').value.trim().toLowerCase(),password=$('pass').value,name=$('name').value.trim();if(!email||password.length<6)throw Error('Informe e-mail e senha com pelo menos 6 caracteres.');const d=await api('/auth/v1/signup',{method:'POST',body:JSON.stringify({email,password,data:{role,full_name:name,phone:''}})});if(!d.access_token){loginView('Conta criada. Confirme o e-mail e depois use Entrar.');return}await enter(d,role)}catch(e){loginView(e.message)}}async function login(){try{role=$('role').value;const d=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:$('email').value.trim().toLowerCase(),password:$('pass').value})});await enter(d,'passenger')}catch(e){loginView(e.message)}}async function enter(d,r){sessionStorage.setItem(TK,d.access_token);if(d.refresh_token)sessionStorage.setItem('kd_refresh',d.refresh_token);const id=uid(d.access_token);const rows=await api(`/rest/v1/profiles?select=id,full_name,phone,role&id=eq.${encodeURIComponent(id)}&limit=1`,{accessToken:d.access_token});if(!rows[0])throw Error('Perfil não encontrado.');profile=rows[0];role=profile.role||r;if(role==='driver'){const dr=(await api(`/rest/v1/driver_profiles?select=status,verified&id=eq.${encodeURIComponent(id)}&limit=1`,{accessToken:d.access_token}))[0];profile.approved=!!(dr&&dr.status==='active'&&dr.verified)}sessionStorage.setItem(RK,role);me={id};start()}async function start(){if(role==='driver')startGPS();renderHome();loadRides()}function startGPS(){if(!navigator.geolocation)return;watch=navigator.geolocation.watchPosition(async p=>{try{await api('/rest/v1/driver_locations?on_conflict=driver_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates'},body:JSON.stringify({driver_id:me.id,latitude:p.coords.latitude,longitude:p.coords.longitude,is_online:true,updated_at:new Date().toISOString()})})}catch(_){}} ,()=>{},{enableHighAccuracy:true,maximumAge:5000,timeout:15000})}function renderHome(){document.getElementById('app').innerHTML=`<div class="app"><header class="top"><div class="brand">♛ KING DRIVER</div><div class="pill">${role==='driver'?'MOTORISTA':'PASSAGEIRO'}</div></header><main class="panel"><div id="main"></div><div class="nav"><button onclick="renderHome();loadRides()">Início</button><button onclick="loadHistory()">Corridas</button><button onclick="profileView()">Perfil</button></div></main></div>`;role==='driver'?driverView():passengerView()}function passengerView(){document.getElementById('main').innerHTML=`<section class="card"><h2>Solicitar corrida</h2><div class="field"><label>ORIGEM</label><input id="origin" placeholder="Centro de Sabará"></div><div class="field"><label>DESTINO</label><input id="dest" placeholder="Destino"></div><div class="grid"><div class="field"><label>CATEGORIA</label><select id="cat"><option value="economy">Econômico</option><option value="comfort">Conforto</option><option value="premium">Premium</option></select></div><div class="field"><label>VALOR</label><input id="fare" type="number" min="1" step="0.5" value="18.50"></div></div><button class="btn" onclick="requestRide()">Solicitar corrida</button></section><section class="card"><h3>Minhas corridas</h3><div id="list">Carregando…</div></section>`}function driverView(){document.getElementById('main').innerHTML=`<section class="card"><h2>Central do motorista</h2><p class="muted">${profile.approved?'Motorista aprovado.':'Motorista pendente de aprovação administrativa.'}</p><button class="btn" onclick="loadRides()">Atualizar solicitações</button></section><section class="card"><h3>Solicitações disponíveis</h3><div id="list">Carregando…</div></section>`}async function requestRide(){try{const o=$('origin').value.trim(),d=$('dest').value.trim(),f=Number($('fare').value),c=$('cat').value;if(!o||!d||f<=0)throw Error('Preencha origem, destino e valor.');await api('/rest/v1/rides',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({passenger_id:me.id,pickup_address:o,destination_address:d,category:c,offered_fare:f,status:'requested'})});loadRides()}catch(e){alert(e.message)}}async function loadRides(){try{const q=role==='driver'?'/rest/v1/rides?select=*&status=eq.requested&order=requested_at.desc&limit=30':`/rest/v1/rides?select=*&passenger_id=eq.${encodeURIComponent(me.id)}&order=created_at.desc&limit=30`;const rows=await api(q);const list=$('list');if(!list)return;list.innerHTML=rows.length?rows.map(r=>{let a='';if(role==='driver'&&r.status==='requested'&&profile.approved)a=`<button class="btn" onclick="accept('${r.id}')">Aceitar corrida</button>`;if(role==='passenger'&&r.status==='requested')a=`<button class="btn alt" onclick="changeStatus('${r.id}','cancelled')">Cancelar</button>`;if(role==='driver'&&r.driver_id===me.id&&r.status==='accepted')a=`<button class="btn" onclick="changeStatus('${r.id}','arriving')">Estou a caminho</button>`;if(role==='driver'&&r.driver_id===me.id&&r.status==='arriving')a=`<button class="btn" onclick="changeStatus('${r.id}','in_progress')">Iniciar corrida</button>`;if(role==='driver'&&r.driver_id===me.id&&r.status==='in_progress')a=`<button class="btn" onclick="changeStatus('${r.id}','completed')">Finalizar corrida</button>`;return`<div class="ride"><b>${esc(r.pickup_address)} → ${esc(r.destination_address)}</b><p class="muted">${esc(r.category)} • ${esc(r.status)}</p><strong>R$ ${Number(r.final_fare??r.offered_fare??0).toFixed(2).replace('.',',')}</strong>${a}</div>`}).join(''):'<p class="muted">Nenhuma corrida.</p>'}catch(e){const list=$('list');if(list)list.innerHTML='<div class="danger">'+esc(e.message)+'</div>'}}async function accept(id){try{await api('/rest/v1/rpc/accept_ride',{method:'POST',body:JSON.stringify({p_ride_id:id})});loadRides()}catch(e){alert(e.message)}}async function changeStatus(id,status){try{await api('/rest/v1/rpc/update_ride_status',{method:'POST',body:JSON.stringify({p_ride_id:id,p_status:status})});loadRides()}catch(e){alert(e.message)}}async function loadHistory(){try{const rows=await api(`/rest/v1/rides?select=*&or=(passenger_id.eq.${encodeURIComponent(me.id)},driver_id.eq.${encodeURIComponent(me.id)})&order=created_at.desc&limit=50`);document.getElementById('main').innerHTML='<section class="card"><h2>Histórico</h2>'+((rows||[]).map(r=>`<div class="ride"><b>${esc(r.pickup_address)} → ${esc(r.destination_address)}</b><p class="muted">${esc(r.status)} • R$ ${Number(r.final_fare??r.offered_fare??0).toFixed(2).replace('.',',')}</p></div>`).join('')||'<p class="muted">Nenhuma corrida.</p>')+'</section>'}catch(e){alert(e.message)}}function profileView(){document.getElementById('main').innerHTML=`<section class="card"><h2>Meu perfil</h2><p><b>Nome:</b> ${esc(profile.full_name||'—')}</p><p><b>Perfil:</b> ${role==='driver'?'Motorista':'Passageiro'}</p>${role==='driver'?`<p><b>Status:</b> ${profile.approved?'Aprovado':'Pendente'}</p>`:''}<button class="btn alt" onclick="logout()">Sair</button></section>`}async function logout(){if(watch!==null)navigator.geolocation.clearWatch(watch);const t=token();sessionStorage.clear();await fetch(URL+'/auth/v1/logout',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+t}}).catch(()=>{});loginView()}(async()=>{const t=token();if(t){try{await enter({access_token:t},sessionStorage.getItem(RK)||'passenger');return}catch(_){sessionStorage.clear()}}loginView()})();</script></body></html>
