<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6a000"><title>King Driver Sabará</title><style>body{margin:0;background:#111;font-family:system-ui,sans-serif;color:#222}*{box-sizing:border-box}button,input,select{font:inherit}button{border:0;border-radius:12px;padding:13px;font-weight:800;cursor:pointer}.app{max-width:560px;margin:auto;min-height:100vh;background:#f5f4f1}.top{padding:16px;background:#fff;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:20px;color:#111}.brand span{background:#f6a000;color:#fff;border-radius:12px;padding:8px;margin-right:8px}.panel{padding:18px}.card{background:#fff;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 2px 10px #0001}.field{margin:10px 0}.field label{display:block;font-size:11px;font-weight:900;color:#666;margin-bottom:5px}.field input,.field select{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;background:#fff}.primary{width:100%;background:#f6a000;color:#fff}.secondary{width:100%;background:#eee}.danger{background:#d33;color:#fff}.muted{color:#777;font-size:13px}.ok{color:#159447}.bad{color:#c33}.map{height:300px;background:linear-gradient(145deg,#ece8e2,#fff);border-radius:22px;position:relative;overflow:hidden}.map:before{content:"";position:absolute;inset:-30%;background:repeating-linear-gradient(20deg,transparent 0 52px,#ddd9d3 54px 57px,transparent 59px 108px),repeating-linear-gradient(110deg,transparent 0 90px,#e5e1db 92px 95px,transparent 97px 170px);transform:rotate(-5deg)}.pin{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);font-size:48px}.status{padding:9px 12px;border-radius:99px;background:#eee;font-weight:800;font-size:12px}.ride{border-left:5px solid #f6a000}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.small{font-size:12px}.hide{display:none}.nav{display:flex;gap:8px;margin-top:12px}.nav button{flex:1;background:#fff}.login{min-height:100vh;background:linear-gradient(160deg,#111,#292929);padding:24px;display:flex;align-items:center}.loginbox{background:#fff;border-radius:26px;padding:22px;width:100%}</style></head><body><div id="app"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="file:///android_asset/config.js"></script><script>const {createClient}=supabase;const db=createClient('https://zfsvctjqljxchxbnuvui.supabase.co','sb_publishable_17rKbweYH7V1E0C0-TPivg_8w4hUx5A',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});let role='passenger',watch=null,me=null,channel=null;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const msg=t=>alert(t);async function profile(){const {data,error}=await db.from('profiles').select('*').eq('id',me.id).maybeSingle();if(error)throw error;if(!data){const {data:p,error:e}=await db.from('profiles').insert({id:me.id,full_name:me.user_metadata?.full_name||me.email,phone:me.user_metadata?.phone||null,role}).select().single();if(e)throw e;return p}return data}function renderLogin(){ $('app').innerHTML='<div class="login"><div class="loginbox"><div style="text-align:center;font-size:48px">↗</div><h1 style="text-align:center">KING DRIVER</h1><p class="muted" style="text-align:center">Sabará • Minas Gerais</p><div class="field"><label>TIPO DE CONTA</label><select id="role"><option value="passenger">Passageiro</option><option value="driver">Motorista</option></select></div><div class="field"><label>NOME</label><input id="name" placeholder="Nome completo"></div><div class="field"><label>E-MAIL</label><input id="email" type="email" placeholder="voce@email.com"></div><div class="field"><label>SENHA</label><input id="pass" type="password" placeholder="mínimo 6 caracteres"></div><button class="primary" onclick="signup()">Criar conta</button><button class="secondary" onclick="login()" style="margin-top:8px">Entrar</button><p class="muted">A autenticação é feita pelo Supabase. A sessão fica persistida no aparelho.</p></div></div>'}async function signup(){try{role=$('role').value;const {data,error}=await db.auth.signUp({email:$('email').value.trim().toLowerCase(),password:$('pass').value,data:{full_name:$('name').value.trim(),phone:'',role}});if(error)throw error;if(!data.session){msg('Conta criada. Confirme o e-mail se a confirmação estiver habilitada e depois entre.');return}me=data.user;await profile();start()}catch(e){msg(e.message)}}async function login(){try{role=$('role').value;const {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim().toLowerCase(),password:$('pass').value});if(error)throw error;me=data.user;const p=await profile();role=p.role;start()}catch(e){msg(e.message)}}async function start(){await locationStart();renderHome();subscribe()}async function locationStart(){if(!navigator.geolocation){msg('GPS não disponível neste aparelho.');return}watch=navigator.geolocation.watchPosition(async pos=>{const loc={driver_id:me.id,latitude:pos.coords.latitude,longitude:pos.coords.longitude,is_online:true,updated_at:new Date().toISOString()};if(role==='driver'){const {error}=await db.from('driver_locations').upsert(loc);if(error)console.warn(error)}$('coords').textContent=pos.coords.latitude.toFixed(6)+', '+pos.coords.longitude.toFixed(6)},e=>console.warn(e),{enableHighAccuracy:true,maximumAge:5000,timeout:15000})}function stopLocation(){if(watch!==null){navigator.geolocation.clearWatch(watch);watch=null}}function renderHome(){const driver=role==='driver';$('app').innerHTML='<div class="app"><div class="top"><div class="brand"><span>↗</span>KING DRIVER</div><span class="status">'+(driver?'MOTORISTA':'PASSAGEIRO')+'</span></div><div class="panel"><div class="map"><div class="pin">📍</div></div><p class="small">Minha localização: <b id="coords">aguardando GPS…</b></p><div id="content"></div><div class="nav"><button onclick="renderHome()">Início</button><button onclick="rides()">Corridas</button><button onclick="logout()">Sair</button></div></div></div>';if(driver)driverView();else passengerView()}async function passengerView(){const c=$('content');c.innerHTML='<div class="card"><h2>Solicitar corrida</h2><div class="field"><label>DESTINO</label><input id="dest" placeholder="Ex.: Centro de Sabará"></div><div class="field"><label>VALOR OFERTADO (R$)</label><input id="fare" type="number" min="0" step="0.50" value="15"></div><button class="primary" onclick="requestRide()">Solicitar agora</button></div><div class="card"><h3>Corridas em andamento</h3><div id="active">Carregando…</div></div>';loadMyRides()}async function driverView(){const c=$('content');c.innerHTML='<div class="card"><div class="row"><h2>Motorista</h2><button class="secondary" onclick="toggleOnline()">Alternar online</button></div><p class="muted">Com GPS autorizado, sua posição é atualizada no banco para aproximar solicitações.</p></div><div class="card"><h3>Solicitações em tempo real</h3><div id="offers">Carregando…</div></div>';loadOpenRides()}async function requestRide(){const {data:{user}}=await db.auth.getUser();const dest=$('dest').value.trim(),fare=Number($('fare').value||0);if(!dest||fare<=0)return msg('Informe destino e valor.');const pos=await new Promise((resolve,reject)=>navigator.geolocation.getCurrentPosition(resolve,reject,{enableHighAccuracy:true,timeout:10000}));const {data,error}=await db.from('rides').insert({passenger_id:user.id,pickup_address:'Minha localização',destination_address:dest,offered_fare:fare,pickup_lat:pos.coords.latitude,pickup_lng:pos.coords.longitude,status:'searching'}).select().single();if(error)return msg(error.message);msg('Corrida solicitada. Aguardando motorista.');loadMyRides()}async function loadMyRides(){const {data,error}=await db.from('rides').select('*').eq('passenger_id',me.id).order('created_at',{ascending:false}).limit(10);if(error){$('active').textContent=error.message;return}$('active').innerHTML=(data||[]).map(r=>'<div class="card ride"><b>'+esc(r.destination_address)+'</b><p>R$ '+Number(r.offered_fare||0).toFixed(2)+' • '+esc(r.status)+'</p></div>').join('')||'<p class="muted">Nenhuma corrida.</p>'}async function loadOpenRides(){const {data,error}=await db.from('rides').select('*').in('status',['requested','searching']).order('created_at',{ascending:false}).limit(20);if(error){$('offers').textContent=error.message;return}$('offers').innerHTML=(data||[]).map(r=>'<div class="card ride"><b>'+esc(r.pickup_address)+' → '+esc(r.destination_address)+'</b><p>R$ '+Number(r.offered_fare||0).toFixed(2)+'</p><button class="primary" onclick="acceptRide(\''+r.id+'\')">Aceitar corrida</button></div>').join('')||'<p class="muted">Nenhuma solicitação aberta.</p>'}async function acceptRide(id){const {error}=await db.from('rides').update({driver_id:me.id,status:'accepted',accepted_at:new Date().toISOString()}).eq('id',id).in('status',['requested','searching']);if(error)return msg(error.message);msg('Corrida aceita.');loadOpenRides()}async function rides(){const {data,error}=await db.from('rides').select('*').or('passenger_id.eq.'+me.id+',driver_id.eq.'+me.id).order('created_at',{ascending:false}).limit(30);$('content').innerHTML='<div class="card"><h2>Histórico</h2>'+(error?'<p>'+esc(error.message)+'</p>':(data||[]).map(r=>'<div class="card ride"><b>'+esc(r.pickup_address)+' → '+esc(r.destination_address)+'</b><p>R$ '+Number(r.final_fare||r.offered_fare||0).toFixed(2)+' • '+esc(r.status)+'</p></div>').join('')||'<p>Nenhuma corrida.</p>')+'</div>'}function subscribe(){if(channel)db.removeChannel(channel);channel=db.channel('king-driver-live',{config:{private:false}}).on('postgres_changes',{event:'*',schema:'public',table:'rides'},()=>{role==='driver'?loadOpenRides():loadMyRides()}).subscribe()}async function toggleOnline(){const {data}=await db.from('driver_locations').select('is_online').eq('driver_id',me.id).maybeSingle();const online=!(data?.is_online);const pos=await new Promise((resolve,reject)=>navigator.geolocation.getCurrentPosition(resolve,reject));await db.from('driver_locations').upsert({driver_id:me.id,latitude:pos.coords.latitude,longitude:pos.coords.longitude,is_online:online,updated_at:new Date().toISOString()});msg(online?'Você está ONLINE':'Você está OFFLINE')}async function logout(){stopLocation();if(channel)db.removeChannel(channel);await db.auth.signOut();me=null;renderLogin()}db.auth.getSession().then(async({data})=>{if(data.session){me=data.session.user;const p=await profile();role=p.role;start()}else renderLogin()});</script></body></html>
