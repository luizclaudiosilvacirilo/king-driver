<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>King Drive Sabará</title><style>:root{--gold:#d4af37;--orange:#f39a16;--bg:#070707;--card:#151515;--muted:#a9a9a9;--ok:#25c281;--red:#e14b4b}*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Arial}.app{max-width:520px;margin:auto;min-height:100vh;background:#0b0b0b}.top{padding:16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #292929}.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.5px}.brand img{width:48px;height:48px}.content{padding:16px}.hero{text-align:center;padding:28px 8px}.hero img{width:150px;height:150px}.hero h1{font-size:31px;margin:12px 0 4px}.muted{color:var(--muted);font-size:13px}.card{background:var(--card);border:1px solid #292929;border-radius:18px;padding:16px;margin:12px 0}.btn{width:100%;padding:14px;border:0;border-radius:13px;margin-top:10px;font-weight:900;font-size:15px}.gold{background:var(--gold);color:#080808}.dark{background:#292929;color:#fff}.green{background:var(--ok);color:#06130e}.red{background:var(--red);color:#fff}.input,.select{width:100%;padding:13px;border:1px solid #343434;border-radius:12px;background:#101010;color:#fff;margin:6px 0}.map{height:260px;border-radius:18px;background:linear-gradient(135deg,#1c271f,#0f1110);position:relative;overflow:hidden}.map:before{content:"";position:absolute;inset:-20%;background:repeating-linear-gradient(25deg,transparent 0 45px,#2d3930 47px 49px,transparent 51px 100px);transform:rotate(-5deg)}.pin{position:absolute;font-size:28px}.p1{left:20%;top:30%}.p2{right:20%;bottom:25%}.car{position:absolute;font-size:25px}.c1{left:48%;top:25%}.c2{right:30%;top:50%}.row{display:flex;gap:10px;justify-content:space-between;align-items:center}.stat{flex:1;background:#1c1c1c;padding:12px;border-radius:13px}.stat b{display:block;color:var(--gold);font-size:20px}.offer{font-size:28px;font-weight:900;color:var(--gold)}.nav{position:sticky;bottom:0;background:#101010;border-top:1px solid #292929;display:grid;grid-template-columns:repeat(3,1fr);padding:7px}.nav button{background:none;border:0;color:#aaa;padding:8px;font-weight:800}.nav .on{color:var(--gold)}.success{color:var(--ok)}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #292929;text-align:left;font-size:12px}.logoWrap{display:grid;place-items:center}.badge{background:#242424;border-radius:20px;padding:6px 10px;font-size:11px}.login{min-height:100vh;padding:22px;display:grid;place-items:center;background:linear-gradient(150deg,#050505,#1b170f)}.loginbox{width:100%;background:#121212;border:1px solid #292929;border-radius:24px;padding:22px}.loginbox img{width:110px;height:110px;display:block;margin:auto}.check{color:var(--ok)}.note{background:#1b170d;border:1px solid #4d3c19;padding:12px;border-radius:13px;font-size:12px;margin:10px 0}</style></head><body><div id="root" class="app"></div><script>
const KEY='king-drive-sabara-v1';let db=JSON.parse(localStorage.getItem(KEY)||'null')||{users:[],rides:[],session:null,platformRate:.10,online:true};let role='passenger';
const logo='data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><rect width="300" height="300" rx="55" fill="#080808" stroke="#d4af37" stroke-width="10"/><path d="M45 190 Q90 125 155 150 T260 175" fill="none" stroke="#f39a16" stroke-width="12"/><path d="M62 174h105l22 22H55z" fill="#111" stroke="#d4af37" stroke-width="6"/><circle cx="82" cy="200" r="15" fill="#d4af37"/><circle cx="169" cy="200" r="15" fill="#d4af37"/><path d="M180 190h50l18 20h-72z" fill="#111" stroke="#f39a16" stroke-width="5"/><circle cx="193" cy="212" r="12" fill="#d4af37"/><circle cx="240" cy="212" r="12" fill="#d4af37"/><text x="150" y="105" text-anchor="middle" fill="#fff" font-size="36" font-family="Arial" font-weight="900">KING</text><text x="150" y="142" text-anchor="middle" fill="#d4af37" font-size="34" font-family="Arial" font-weight="900">DRIVE</text><text x="150" y="270" text-anchor="middle" fill="#fff" font-size="23" font-family="Arial" font-weight="900">SABARÁ</text></svg>`);
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));const me=()=>db.users.find(u=>u.id===db.session);const money=n=>'R$ '+Number(n||0).toFixed(2).replace('.',',');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shell(body){return `<div class="top"><div class="brand"><img src="${logo}"> <span>King Drive Sabará</span></div>${me()?'<span class="badge">'+(me().role==='driver'?'MOTORISTA':'PASSAGEIRO')+'</span>':''}</div><div class="content">${body}</div>`}
function start(){if(!me())return login();home()}
function login(){document.getElementById('root').innerHTML=`<div class="login"><div class="loginbox"><img src="${logo}"><h1 style="text-align:center">King Drive Sabará</h1><p class="muted" style="text-align:center">Mobilidade que conecta. Você no controle.</p><div class="row"><button id="rp" class="btn gold" onclick="role='passenger';pick()">Passageiro</button><button id="rd" class="btn dark" onclick="role='driver';pick()">Motorista</button></div><input id="li" class="input" placeholder="E-mail ou telefone"><input id="lp" class="input" type="password" placeholder="Senha"><button class="btn gold" onclick="enter()">ENTRAR</button><button class="btn dark" onclick="signup()">CRIAR CONTA</button><button class="btn dark" onclick="owner()">ACESSO DO PROPRIETÁRIO</button></div></div>`}
function pick(){document.getElementById('rp').className='btn '+(role==='passenger'?'gold':'dark');document.getElementById('rd').className='btn '+(role==='driver'?'gold':'dark')}
function signup(){document.getElementById('root').innerHTML=`<div class="login"><div class="loginbox"><img src="${logo}"><h2>Criar conta</h2><p class="muted">${role==='driver'?'Cadastro de motorista':'Cadastro de passageiro'}</p><input id="sn" class="input" placeholder="Nome completo"><input id="se" class="input" placeholder="E-mail ou telefone"><input id="sp" class="input" type="password" placeholder="Senha (mínimo 6 caracteres)">${role==='driver'?'<input id="sv" class="input" placeholder="Veículo (ex.: Honda CG 160)"><input id="st" class="input" placeholder="Placa">':''}<button class="btn gold" onclick="createUser()">CRIAR CONTA</button><button class="btn dark" onclick="login()">VOLTAR</button></div></div>`}
function createUser(){let name=sn.value.trim(),loginv=se.value.trim().toLowerCase(),pass=sp.value;if(!name||!loginv||pass.length<6)return alert('Preencha os dados corretamente.');if(db.users.some(u=>u.login===loginv))return alert('Conta já cadastrada.');let u={id:Date.now(),name,login:loginv,pass,role,vehicle:role==='driver'?sv.value.trim():'',plate:role==='driver'?st.value.trim():'',wallet:0,active:true};db.users.push(u);db.session=u.id;save();home()}
function enter(){let l=li.value.trim().toLowerCase(),p=lp.value,u=db.users.find(x=>x.login===l&&x.pass===p&&x.role===role);if(!u)return alert('Conta não encontrada ou senha incorreta.');db.session=u.id;save();home()}
function owner(){let code=prompt('Digite a senha do proprietário');if(code!=='KING2026')return alert('Acesso negado.');db.session='OWNER';home()}
function logout(){db.session=null;save();login()}
function home(){let u=me();if(db.session==='OWNER')return admin();if(!u)return login();let rs=db.rides.filter(r=>u.role==='driver'?r.driverId===u.id:r.passengerId===u.id);return go(shell(`<div class="map"><span class="pin p1">📍</span><span class="pin p2">🏁</span><span class="car c1">🚕</span><span class="car c2">🏍️</span></div><div class="card"><h2>Olá, ${esc(u.name.split(' ')[0])}</h2><div class="row"><div class="stat"><small class="muted">Corridas</small><b>${rs.length}</b></div><div class="stat"><small class="muted">${u.role==='driver'?'Ganhos':'Status'}</small><b>${u.role==='driver'?money(u.wallet):'Ativo'}</b></div></div></div>${u.role==='driver'?driverPanel(rs):passengerPanel(rs)}<div class="nav"><button class="on" onclick="home()">⌂<br><small>Início</small></button><button onclick="historyPage()">▣<br><small>Corridas</small></button><button onclick="profile()">♙<br><small>Perfil</small></button></div>`))}
function passengerPanel(rs){let active=rs.find(r=>!['completed','cancelled'].includes(r.status));return active?`<div class="card"><h3>Corrida #${active.id}</h3><p>${esc(active.origin)} → ${esc(active.destination)}</p><div class="offer">${money(active.fare)}</div><p class="success">${active.status==='requested'?'Procurando motorista':active.status==='accepted'?'Motorista a caminho':'Corrida em andamento'}</p>${active.status==='accepted'?'<button class="btn green" onclick="finish('+active.id+')">FINALIZAR CORRIDA</button>':''}<button class="btn red" onclick="cancel('+active.id+')">CANCELAR</button></div>`:`<button class="btn gold" onclick="newRide()">🏍️ SOLICITAR CORRIDA</button>`}
function driverPanel(rs){let pending=db.rides.find(r=>r.status==='requested'&&!r.driverId);return pending?`<div class="card"><h3>Nova solicitação</h3><p>${esc(pending.origin)} → ${esc(pending.destination)}</p><div class="offer">${money(pending.fare)}</div><button class="btn green" onclick="accept(${pending.id})">ACEITAR CORRIDA</button></div>`:`<div class="card"><b>${db.online?'● ONLINE':'○ OFFLINE'}</b><p class="muted">Novas solicitações aparecerão aqui.</p></div>`}
function newRide(){go(shell(`<h2>Solicitar corrida</h2><input id="o" class="input" value="Minha localização" placeholder="Origem"><input id="d" class="input" placeholder="Destino"><input id="k" class="input" type="number" value="5" min="1" placeholder="Distância em km"><select id="rate" class="select"><option value="1.5">R$ 1,50/km</option><option value="1.75" selected>R$ 1,75/km</option><option value="2">R$ 2,00/km</option></select><div class="card"><small class="muted">Valor estimado</small><div id="fare" class="offer">R$ 8,75</div></div><button class="btn gold" onclick="request()">CONFIRMAR CORRIDA</button><button class="btn dark" onclick="home()">VOLTAR</button>`));k.oninput=calc;rate.onchange=calc}
function calc(){fare.textContent=money(Number(k.value||0)*Number(rate.value||1.75))}
function request(){let u=me(),f=+(Number(k.value)*Number(rate.value)).toFixed(2),dest=d.value.trim();if(!dest)return alert('Informe o destino.');db.rides.push({id:1000+db.rides.length+1,passengerId:u.id,driverId:null,origin:o.value.trim(),destination:dest,fare:f,status:'requested',createdAt:new Date().toISOString()});save();home()}
function accept(id){let u=me(),r=db.rides.find(x=>x.id===id);r.driverId=u.id;r.status='accepted';r.driverName=u.name;save();home()}
function finish(id){let r=db.rides.find(x=>x.id===id),d=db.users.find(x=>x.id===r.driverId);r.status='completed';if(d)d.wallet+=(r.fare*(1-db.platformRate));save();home()}
function cancel(id){let r=db.rides.find(x=>x.id===id);r.status='cancelled';save();home()}
function historyPage(){let u=me(),rs=db.rides.filter(r=>u.role==='driver'?r.driverId===u.id:r.passengerId===u.id);go(shell(`<h2>Histórico</h2>${rs.length?rs.slice().reverse().map(r=>`<div class="card"><b>#${r.id}</b><p>${esc(r.origin)} → ${esc(r.destination)}</p><span class="muted">${r.status}</span><div class="offer">${money(r.fare)}</div></div>`).join(''):'<p class="muted">Nenhuma corrida registrada.</p>'}<button class="btn dark" onclick="home()">VOLTAR</button>`))}
function profile(){let u=me();go(shell(`<h2>Meu perfil</h2><div class="card"><b>${esc(u.name)}</b><p class="muted">${esc(u.login)}</p><p>Tipo: ${u.role==='driver'?'Motorista':'Passageiro'}</p>${u.role==='driver'?'<p>Veículo: '+esc(u.vehicle||'Não informado')+'</p><p>Placa: '+esc(u.plate||'Não informada')+'</p><p>Participação do motorista: <b>90%</b></p>':''}</div><button class="btn dark" onclick="home()">VOLTAR</button><button class="btn red" onclick="logout()">SAIR</button>`))}
function admin(){let done=db.rides.filter(r=>r.status==='completed'),gross=done.reduce((a,r)=>a+r.fare,0),platform=gross*db.platformRate;go(`<div class="top"><div class="brand"><img src="${logo}"><span>King Drive Sabará</span></div><span class="badge">PROPRIETÁRIO</span></div><div class="content"><h2>Painel do proprietário</h2><div class="row"><div class="stat"><small class="muted">Corridas</small><b>${db.rides.length}</b></div><div class="stat"><small class="muted">Volume</small><b>${money(gross)}</b></div></div><div class="card"><p>Participação da plataforma</p><div class="offer">${money(platform)}</div><p class="muted">10% sobre corridas finalizadas.</p></div><div class="card"><p>Usuários</p><p>Passageiros: ${db.users.filter(u=>u.role==='passenger').length}</p><p>Motoristas: ${db.users.filter(u=>u.role==='driver').length}</p></div><button class="btn dark" onclick="logout()">SAIR</button></div>`)}
function go(x){document.getElementById('root').innerHTML=x}start();
</script></body></html>
