<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5a000">
<meta name="description" content="King Driver — plataforma de demonstração para motoristas e passageiros.">
<link rel="manifest" href="manifest.webmanifest">
<title>King Driver</title>
<style>
:root{--gold:#f6a000;--gold2:#ffbd32;--ink:#191919;--muted:#777;--card:#fff;--line:#e9e9e9;--green:#17d34b;--red:#e84b42;--bg:#f5f4f1}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:#111}button,input,select{font:inherit}button{border:0;cursor:pointer}.app{width:100%;max-width:520px;min-height:100vh;margin:auto;background:var(--bg);position:relative;overflow:hidden}.screen{min-height:100vh;display:flex;flex-direction:column}.topbar{height:68px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;position:relative;z-index:4;box-shadow:0 1px 0 #ddd}.brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:20px}.logo{width:42px;height:42px;border-radius:12px;background:var(--gold);display:grid;place-items:center;color:#fff;font-size:23px;box-shadow:0 4px 12px #0002}.brand span{color:#111}.top-actions{display:flex;gap:8px}.icon-btn{width:42px;height:42px;border-radius:50%;background:#f2f2f2;font-size:20px}.map{height:56vh;min-height:410px;position:relative;overflow:hidden;background:linear-gradient(145deg,#eeeae3,#f7f4ef)}.map:before{content:"";position:absolute;inset:-20%;background:repeating-linear-gradient(18deg,transparent 0 55px,#ddd8d0 57px 60px,transparent 62px 115px),repeating-linear-gradient(102deg,transparent 0 90px,#e5e1db 92px 96px,transparent 98px 170px);opacity:.85;transform:rotate(-5deg)}.river{position:absolute;width:125%;height:105px;left:-15%;top:24%;background:#7ed7ef;transform:rotate(8deg);border-radius:55% 35%;opacity:.8}.road{position:absolute;height:10px;background:#fff;border:2px solid #d7d3ce;border-radius:99px;box-shadow:0 1px 2px #0001}.r1{width:105%;left:-3%;top:31%;transform:rotate(20deg)}.r2{width:90%;left:5%;top:53%;transform:rotate(-18deg)}.r3{width:115%;left:-8%;top:68%;transform:rotate(9deg)}.r4{width:75%;left:16%;top:43%;transform:rotate(64deg)}.street{position:absolute;font-size:12px;font-weight:700;color:#444;transform:rotate(-18deg)}.s1{top:34%;left:12%}.s2{top:57%;right:7%;transform:rotate(9deg)}.s3{bottom:12%;left:23%;transform:rotate(9deg)}.place{position:absolute;color:#555;font-weight:800;font-size:13px}.p1{top:17%;right:12%}.p2{top:47%;left:12%}.p3{bottom:14%;right:17%}.multiplier{position:absolute;right:13%;top:36%;width:86px;height:86px;border-radius:50%;background:#ff8b6e;border:1px solid #555;display:grid;place-items:center;font-weight:900;font-size:16px;box-shadow:0 3px 9px #0002}.arrow{position:absolute;left:46%;bottom:17%;font-size:55px;color:#f6a000;text-shadow:0 2px 2px #fff;transform:rotate(12deg)}.online{position:absolute;right:15px;top:15px;background:#fff;border-radius:40px;padding:10px 14px 10px 18px;display:flex;align-items:center;gap:13px;box-shadow:0 4px 18px #0002;font-weight:900;color:#e89a00}.dot{width:30px;height:30px;border-radius:50%;background:var(--green);box-shadow:0 2px 10px #0002}.dot.off{background:#aaa}.map-tools{position:absolute;left:16px;bottom:16px;display:flex;flex-direction:column;gap:10px}.map-tool{width:54px;height:54px;border-radius:15px;background:#fff;box-shadow:0 3px 12px #0002;font-size:22px}.map-tool.gold{background:var(--gold);color:#fff;font-weight:900}.map-tools small{font-size:10px;display:block;margin-top:-5px}.ride-btn{position:absolute;right:16px;bottom:20px;padding:18px 26px;border-radius:18px;background:var(--gold);color:#fff;font-weight:900;font-size:18px;box-shadow:0 7px 18px #0003}.summary{background:#fff;border-radius:28px 28px 0 0;margin-top:-24px;position:relative;z-index:3;padding:22px 18px 14px;box-shadow:0 -2px 14px #0001}.summary h2{font-size:20px;margin:0 0 14px}.summary-row{display:grid;grid-template-columns:1fr 1fr;background:#f8f8f8;border-radius:22px;padding:18px}.stat{display:flex;align-items:center;gap:10px;padding:0 12px}.stat+ .stat{border-left:1px solid #ddd}.stat-icon{width:45px;height:45px;border-radius:15px;background:#fff2d7;display:grid;place-items:center;color:var(--gold);font-size:20px}.stat b{display:block;font-size:21px;color:var(--gold)}.stat small{color:#888;font-weight:700}.tabs{height:76px;background:#fff;border-top:1px solid #eee;display:flex;align-items:center;justify-content:space-around;position:sticky;bottom:0;z-index:5}.tab{background:none;color:#999;font-size:25px;padding:9px 15px}.tab.active{color:var(--gold)}.tab small{display:block;font-size:9px;margin-top:3px;font-weight:800}.panel{position:absolute;inset:68px 0 0;background:var(--bg);z-index:6;overflow:auto;padding:18px}.panel.hidden{display:none}.panel h2{margin:4px 0 15px}.card{background:#fff;border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 2px 10px #0000000d}.field{margin:9px 0}.field label{font-size:12px;font-weight:800;color:#666;display:block;margin:0 0 5px}.field input,.field select{width:100%;padding:13px 14px;border:1px solid #ddd;border-radius:13px;background:#fff;outline:none}.field input:focus,.field select:focus{border-color:var(--gold)}.primary{width:100%;padding:14px;border-radius:14px;background:var(--gold);color:#fff;font-weight:900}.secondary{width:100%;padding:13px;border-radius:14px;background:#f2f2f2;color:#333;font-weight:800}.danger{background:#fff0ee;color:#d43d35}.toggle{display:flex;align-items:center;justify-content:space-between}.switch{width:60px;height:34px;border-radius:99px;background:#bbb;padding:3px}.switch:after{content:"";display:block;width:28px;height:28px;background:#fff;border-radius:50%;transition:.2s}.switch.on{background:var(--green)}.switch.on:after{transform:translateX(26px)}.ride-card{background:#fff;border-radius:18px;padding:14px;margin:10px 0;border:1px solid #eee}.ride-head{display:flex;justify-content:space-between;gap:8px}.badge{padding:5px 9px;border-radius:99px;background:#f2f2f2;font-size:10px;font-weight:900}.fare{font-size:22px;font-weight:900;color:var(--gold);margin-top:8px}.muted{color:#888;font-size:12px}.modal{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:flex-end;justify-content:center}.modal.hidden{display:none}.modal-card{width:min(520px,100%);background:#fff;border-radius:28px 28px 0 0;padding:22px 20px 28px;animation:up .2s ease}.close{float:right;width:38px;height:38px;border-radius:50%;background:#f3f3f3;font-size:20px}@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:30;background:#202020;color:#fff;padding:12px 16px;border-radius:99px;font-size:13px;font-weight:800;display:none;max-width:90%;text-align:center}.toast.show{display:block}.info-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee;gap:15px}.info-row:last-child{border-bottom:0}.empty{text-align:center;padding:22px;color:#888}.driver-list{display:grid;gap:8px}.driver-item{padding:13px;border:1px solid #eee;border-radius:15px;display:flex;justify-content:space-between}.version{font-size:12px;color:#999;text-align:center;padding:12px}.login{min-height:100vh;background:linear-gradient(160deg,#111,#242424);display:flex;align-items:center;padding:25px}.login-card{width:100%;background:#fff;border-radius:28px;padding:25px}.login-logo{margin:auto auto 15px;width:70px;height:70px;border-radius:22px;background:var(--gold);display:grid;place-items:center;color:#fff;font-size:38px}.mode{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.mode button{padding:12px;border-radius:13px;background:#eee;font-weight:900}.mode button.active{background:var(--gold);color:#fff}.hide{display:none!important}@media(min-width:700px){body{padding:20px 0}.app{border-radius:30px;box-shadow:0 15px 60px #0006;min-height:calc(100vh - 40px)}}
</style>
</head>
<body>
<div class="app" id="app"></div><div class="toast" id="toast"></div>
<script>
const KEY='king-driver-v1';
const state=JSON.parse(localStorage.getItem(KEY)||'null')||{mode:'driver',online:true,trips:[],earnings:0,settings:{name:'Motorista King',vehicle:'Honda CG 160',plate:'KDG-8A00',category:'Moto'},version:'8.0'};
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('show'),2200)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return 'R$ '+Number(n||0).toFixed(2).replace('.',',')}
function render(){document.getElementById('app').innerHTML=`<div class="screen"><div class="topbar"><div class="brand"><div class="logo">↗</div><span>KING <b>DRIVER</b></span></div><div class="top-actions"><button class="icon-btn" onclick="openInfo()">ⓘ</button><button class="icon-btn" onclick="openSettings()">⚙</button></div></div><section class="map"><div class="river"></div><div class="road r1"></div><div class="road r2"></div><div class="road r3"></div><div class="road r4"></div><div class="street s1">Rua Beira Linha</div><div class="street s2">Rua Santana</div><div class="street s3">Rua São Pedro</div><div class="place p1">Rio das Velhas</div><div class="place p2">Centro</div><div class="place p3">Oeiras</div><div class="multiplier">1.49x</div><div class="arrow">➤</div><div class="online" onclick="toggleOnline()"><span>${state.online?'ONLINE':'OFFLINE'}</span><div class="dot ${state.online?'':'off'}"></div></div><div class="map-tools"><button class="map-tool" onclick="zoom(1)">＋</button><button class="map-tool" onclick="zoom(-1)">－</button><button class="map-tool gold" onclick="toast('Visualização 3D ativada')">◆<small>3D</small></button><button class="map-tool gold" onclick="toast('Rota recalculada')">◈<small>ROTA</small></button></div><button class="ride-btn" onclick="openRide()">＋ Corrida</button></section><section class="summary"><h2>Resumo Diário <button style="float:right;border:0;background:#f3f3f3;border-radius:99px;padding:8px 13px;font-weight:800;color:#777" onclick="toast('Resumo alternado')">◉ Ocultar</button></h2><div class="summary-row"><div class="stat"><div class="stat-icon">🏍</div><div><small>Viagens</small><b>${state.trips.length}</b></div></div><div class="stat"><div class="stat-icon">▣</div><div><small>Ganhos</small><b>${money(state.earnings)}</b></div></div></div></section><nav class="tabs"><button class="tab active" onclick="showHome()">🏍<small>Corridas</small></button><button class="tab" onclick="openHistory()">☆<small>Favoritos</small></button><button class="tab" onclick="openWallet()">▤<small>Saldo</small></button><button class="tab" onclick="openTrips()">▣<small>Viagens</small></button><button class="tab" onclick="openProfile()">♙<small>Perfil</small></button></nav><div id="panel" class="panel hidden"></div></div><div id="modal" class="modal hidden"></div>`}
function openModal(html){document.getElementById('modal').innerHTML=`<div class="modal-card"><button class="close" onclick="closeModal()">×</button>${html}</div>`;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function openRide(){openModal(`<h2>Nova corrida</h2><p class="muted">Fluxo de teste do King Driver</p><div class="field"><label>ORIGEM</label><input id="origin" value="Rua Comadre Ana, 391 - Oeiras"></div><div class="field"><label>DESTINO</label><input id="dest" placeholder="Informe o destino"></div><div class="field"><label>VALOR DA CORRIDA</label><input id="fare" type="number" value="15.99" step="0.50"></div><div class="field"><label>CATEGORIA</label><select id="cat"><option>Moto</option><option>Econômico</option><option>Conforto</option></select></div><button class="primary" onclick="createRide()">Solicitar corrida</button>`)}
function createRide(){const o=document.getElementById('origin').value.trim(),d=document.getElementById('dest').value.trim()||'Destino informado pelo passageiro',f=Number(document.getElementById('fare').value)||15.99,c=document.getElementById('cat').value;state.trips.unshift({id:Date.now(),origin:o,destination:d,fare:f,category:c,status:state.mode==='driver'?'accepted':'requested',time:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})});if(state.mode==='driver')state.earnings+=f;save();closeModal();render();toast('Corrida criada com sucesso')}
function openPanel(title,content){const p=document.getElementById('panel');p.innerHTML=`<h2>${title}<button style="float:right;border:0;background:#eee;border-radius:50%;width:40px;height:40px" onclick="closePanel()">×</button></h2>${content}`;p.classList.remove('hidden')}
function closePanel(){document.getElementById('panel').classList.add('hidden')}
function openTrips(){openPanel('Minhas corridas',state.trips.length?state.trips.map(r=>`<div class="ride-card"><div class="ride-head"><b>${esc(r.origin)}</b><span class="badge">${esc(r.status)}</span></div><div class="muted">↓ ${esc(r.destination)} · ${r.time}</div><div class="fare">${money(r.fare)}</div>${r.status==='requested'?'<button class="primary" onclick="accept('+r.id+')">Aceitar corrida</button>':''}${r.status==='accepted'?'<button class="secondary" onclick="finish('+r.id+')">Finalizar corrida</button>':''}</div>`).join(''):'<div class="empty">Nenhuma corrida registrada.<br>Toque em “＋ Corrida” para testar.</div>')}
function accept(id){const r=state.trips.find(x=>x.id===id);if(r){r.status='accepted';state.earnings+=r.fare;save();openTrips();toast('Corrida aceita') }}
function finish(id){const r=state.trips.find(x=>x.id===id);if(r){r.status='completed';save();openTrips();toast('Corrida finalizada')}}
function openHistory(){openPanel('Histórico',state.trips.length?state.trips.map(r=>`<div class="ride-card"><b>${esc(r.destination)}</b><div class="muted">${r.time} · ${esc(r.status)}</div><div class="fare">${money(r.fare)}</div></div>`).join(''):'<div class="empty">Histórico vazio.</div>')}
function openWallet(){openPanel('Saldo e ganhos',`<div class="card"><div class="muted">Saldo acumulado nesta demonstração</div><div style="font-size:36px;font-weight:900;color:var(--gold);margin:8px 0">${money(state.earnings)}</div><div class="info-row"><span>Corridas</span><b>${state.trips.length}</b></div><div class="info-row"><span>Multiplicador ativo</span><b>1.49x</b></div></div><button class="primary" onclick="toast('Solicitação de saque simulada');closePanel()">Solicitar saque</button>`)}
function openProfile(){openPanel('Perfil do motorista',`<div class="card"><div class="info-row"><span>Nome</span><b>${esc(state.settings.name)}</b></div><div class="info-row"><span>Veículo</span><b>${esc(state.settings.vehicle)}</b></div><div class="info-row"><span>Placa</span><b>${esc(state.settings.plate)}</b></div><div class="info-row"><span>Categoria</span><b>${esc(state.settings.category)}</b></div><div class="info-row"><span>Status</span><b>${state.online?'Online':'Offline'}</b></div></div><button class="primary" onclick="openSettings()">Editar cadastro</button>`)}
function openSettings(){openPanel('Configurações',`<div class="card"><div class="field"><label>NOME</label><input id="setName" value="${esc(state.settings.name)}"></div><div class="field"><label>VEÍCULO</label><input id="setVehicle" value="${esc(state.settings.vehicle)}"></div><div class="field"><label>PLACA</label><input id="setPlate" value="${esc(state.settings.plate)}"></div><div class="field"><label>CATEGORIA</label><select id="setCat"><option ${state.settings.category==='Moto'?'selected':''}>Moto</option><option ${state.settings.category==='Econômico'?'selected':''}>Econômico</option><option ${state.settings.category==='Conforto'?'selected':''}>Conforto</option></select></div><button class="primary" onclick="saveSettings()">Salvar alterações</button></div><div class="card"><div class="toggle"><b>Modo de teste</b><button class="switch ${state.mode==='driver'?'on':''}" onclick="switchMode()"></button></div><p class="muted">Alterna entre fluxo motorista e passageiro sem servidor, para testes rápidos.</p></div>`)}
function saveSettings(){state.settings={name:document.getElementById('setName').value||'Motorista King',vehicle:document.getElementById('setVehicle').value||'Honda CG 160',plate:document.getElementById('setPlate').value||'KDG-8A00',category:document.getElementById('setCat').value};save();closePanel();render();toast('Configurações salvas')}
function switchMode(){state.mode=state.mode==='driver'?'passenger':'driver';save();closePanel();render();toast(state.mode==='driver'?'Modo motorista':'Modo passageiro')}
function toggleOnline(){state.online=!state.online;save();render();toast(state.online?'Motorista online':'Motorista offline')}
function openInfo(){openPanel('Informações do app',`<div class="card"><div class="info-row"><span>Nome do app</span><b>King Driver</b></div><div class="info-row"><span>Versão do app</span><b>${state.version}</b></div><div class="info-row"><span>Tipo</span><b>Versão demonstrativa</b></div><div class="info-row"><span>Plataforma</span><b>Web / PWA</b></div><div class="info-row"><span>Código</span><b>Fonte própria</b></div></div><div class="card"><b>Recursos incluídos</b><p class="muted">Mapa visual, online/offline, multiplicador, criação de corrida, aceitação, finalização, histórico, ganhos, perfil, configurações e armazenamento local para testes.</p></div>`)}
function zoom(n){document.querySelector('.map').style.transform=`scale(${n>0?1.04:.97})`;setTimeout(()=>document.querySelector('.map').style.transform='scale(1)',180);toast(n>0?'Zoom aproximado':'Zoom afastado')}
function showHome(){closePanel()}
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body></html>
