<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>King Driver</title><style>body{margin:0;background:#090909;color:#fff;font-family:system-ui}.app{max-width:560px;margin:auto;padding:20px}.brand{text-align:center;font-size:27px;font-weight:900;margin:12px}.brand span{color:#d4af37}.card{background:#151515;border:1px solid #292929;border-radius:16px;padding:16px;margin:12px 0}input,select,button{width:100%;padding:13px;margin:7px 0;box-sizing:border-box;border-radius:10px;border:1px solid #333;background:#0d0d0d;color:#fff}button{font-weight:800;cursor:pointer}.gold{background:#d4af37;color:#111;border:0}.danger{background:#3b1818;color:#ff9999}.muted{color:#aaa;font-size:13px}.price{font-size:30px;color:#d4af37;font-weight:900}.ride{border:1px solid #333;border-radius:12px;padding:12px;margin:8px 0}.ok{color:#54db8d}.top{display:flex;justify-content:space-between;align-items:center}.top button{width:auto;padding:8px 12px}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#222;margin-top:6px;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid input,.grid select{width:100%}</style></head><body><div class="app"><div class="brand">♛ KING <span>DRIVER</span></div><div id="root"></div></div><script type="module">
import './js/config.js';
const U=window.KING_DRIVER_SUPABASE_URL,K=window.KING_DRIVER_SUPABASE_PUBLISHABLE_KEY,T=()=>sessionStorage.getItem('king_driver_access_token')||'';const root=document.getElementById('root');let profile=null,rides=[],watch=null,online=false,driverProfile=null,vehicle=null;
function currentUserId(){const token=T();if(!token)return '';try{const part=token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(atob(part)).sub||''}catch(_){return ''}}
async function api(path,opt={}){if(!T())throw Error('Sessão expirada. Faça login novamente.');const r=await fetch(U+path,{...opt,headers:{apikey:K,Authorization:`Bearer ${T()}`,'Content-Type':'application/json',...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||d.msg||d.error_description||'Erro no servidor');return d}
async function init(){if(!T()){location.href='auth.html';return}try{const [p]=await api('/rest/v1/profiles?select=*&id=eq.'+encodeURIComponent(currentUserId()));profile=p;if(!profile)throw Error('Perfil não encontrado.');if(profile.role==='driver')await loadDriverData();render();await load();setInterval(load,4000)}catch(e){root.innerHTML='<div class="card">'+escapeHTML(e.message)+'<button onclick="location.href=\'auth.html\'">Voltar ao acesso</button></div>'}}
function render(){root.innerHTML=`<div class="top"><div><b>Olá, ${escapeHTML(profile.full_name||(profile.role==='driver'?'Motorista':'Passageiro'))}</b><div class="muted">Modo ${profile.role==='driver'?'motorista':'passageiro'}</div></div><button onclick="logout()">Sair</button></div>`+(profile.role==='driver'?driverUI():passengerUI())+`<div id="status"></div>`}
function passengerUI(){return `<div class="card"><h2>Solicitar corrida</h2><input id="origin" placeholder="Origem" value="São Sebastião do Paraíso, MG"><input id="destination" placeholder="Destino"><select id="category"><option value="economy">Econômico</option><option value="comfort">Conforto</option><option value="premium">Premium</option></select><input id="price" type="number" min="1" step="0.50" value="18.50"><button class="gold" onclick="requestRide()">Solicitar corrida</button></div><div class="card"><h3>Minhas corridas</h3><div id="rides"></div></div>`}
function driverUI(){const approved=driverProfile?.status==='active'&&driverProfile?.verified;return `<div class="card"><h2>Cadastro do motorista</h2><div class="muted">Complete seus dados para enviar seu cadastro para aprovação.</div><div class="badge">Status: ${driverProfile?.status||'pendente'} · ${driverProfile?.verified?'verificado':'aguardando verificação'}</div><input id="license" placeholder="Número da CNH" value="${escapeAttr(driverProfile?.license_number||'')}"><div class="grid"><input id="make" placeholder="Marca" value="${escapeAttr(vehicle?.make||'')}"><input id="model" placeholder="Modelo" value="${escapeAttr(vehicle?.model||'')}"><input id="color" placeholder="Cor" value="${escapeAttr(vehicle?.color||'')}"><input id="plate" placeholder="Placa" value="${escapeAttr(vehicle?.plate||'')}"><select id="vehicleCategory"><option value="economy" ${vehicle?.category==='economy'?'selected':''}>Econômico</option><option value="comfort" ${vehicle?.category==='comfort'?'selected':''}>Conforto</option><option value="premium" ${vehicle?.category==='premium'?'selected':''}>Premium</option></select><input id="year" type="number" min="1990" max="2100" placeholder="Ano" value="${vehicle?.year||''}"></div><button class="gold" onclick="saveDriverOnboarding()">Salvar cadastro</button></div><div class="card"><h2>Central do motorista</h2><button class="gold" onclick="toggleOnline()" id="onlineBtn" ${approved?'':'disabled'}>${online?'Ficar offline':'Ficar online'}</button><div class="muted">${approved?(online?'Você está online e compartilhando sua localização.':'Fique online para receber corridas.'):'Seu cadastro precisa ser aprovado pelo proprietário antes de ficar online.'}</div></div><div class="card"><h3>Corridas disponíveis / minhas corridas</h3><div id="rides"></div></div>`}
async function loadDriverData(){const id=profile.id;const [dp,v,loc]=await Promise.all([api('/rest/v1/driver_profiles?select=*&id=eq.'+id),api('/rest/v1/vehicles?select=*&driver_id=eq.'+id+'&active=eq.true&order=created_at.desc&limit=1'),api('/rest/v1/driver_locations?select=is_online&driver_id=eq.'+id)]);driverProfile=dp[0]||null;vehicle=v[0]||null;online=Boolean(loc[0]?.is_online)}
async function saveDriverOnboarding(){try{const license=document.getElementById('license').value.trim(),make=document.getElementById('make').value.trim(),model=document.getElementById('model').value.trim(),color=document.getElementById('color').value.trim(),plate=document.getElementById('plate').value.trim().toUpperCase(),category=document.getElementById('vehicleCategory').value,year=Number(document.getElementById('year').value);if(!license||!make||!model||!color||!plate||!year)throw Error('Preencha CNH, veículo, cor, placa e ano.');await api('/rest/v1/driver_profiles?on_conflict=id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({id:profile.id,license_number:license,status:'pending',verified:false})});if(vehicle)await api('/rest/v1/vehicles?id=eq.'+vehicle.id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({make,model,color,plate,category,year,active:true})});else await api('/rest/v1/vehicles',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({driver_id:profile.id,make,model,color,plate,category,year,active:true})});await loadDriverData();render();await load();setStatus('Cadastro salvo e enviado para aprovação.');}catch(e){setStatus(e.message,true)}}
async function load(){if(!profile)return;try{rides=profile.role==='driver'?await api('/rest/v1/rides?select=*&or=(status.eq.requested,driver_id.eq.'+encodeURIComponent(profile.id)+')&order=created_at.desc&limit=20'):await api('/rest/v1/rides?select=*&passenger_id=eq.'+encodeURIComponent(profile.id)+'&order=created_at.desc&limit=20');const el=document.getElementById('rides');if(!el)return;el.innerHTML=rides.length?rides.map(r=>rideHTML(r)).join(''):'<div class="muted">Nenhuma corrida ainda.</div>'}catch(e){setStatus(e.message,true)}}
function rideHTML(r){let actions='';if(profile.role==='driver'&&r.status==='requested')actions=`<button class="gold" onclick="acceptRide('${r.id}')">Aceitar corrida</button>`;if(profile.role==='driver'&&r.driver_id===profile.id){if(r.status==='accepted')actions=`<button onclick="statusRide('${r.id}','arriving')">Estou a caminho</button>`;else if(r.status==='arriving')actions=`<button onclick="statusRide('${r.id}','in_progress')">Iniciar corrida</button>`;else if(r.status==='in_progress')actions=`<button class="gold" onclick="statusRide('${r.id}','completed')">Finalizar corrida</button>`}if(profile.role==='passenger'&&['requested','accepted','arriving'].includes(r.status))actions=`<button class="danger" onclick="statusRide('${r.id}','cancelled')">Cancelar</button>`;return `<div class="ride"><b>${escapeHTML(r.pickup_address||'')}</b> → <b>${escapeHTML(r.destination_address||'')}</b><div class="muted">${escapeHTML(r.category||'')} · ${escapeHTML(r.status||'')}</div><div class="price">R$ ${Number(r.final_fare??r.offered_fare??0).toFixed(2)}</div>${actions}</div>`}
async function requestRide(){try{const origin=document.getElementById('origin').value.trim(),destination=document.getElementById('destination').value.trim(),price=Number(document.getElementById('price').value),category=document.getElementById('category').value;if(!origin||!destination||!price)throw Error('Preencha origem, destino e valor.');await api('/rest/v1/rides',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({passenger_id:profile.id,pickup_address:origin,destination_address:destination,category,offered_fare:price,status:'requested'})});setStatus('Corrida solicitada com sucesso.');load()}catch(e){setStatus(e.message,true)}}
async function acceptRide(id){try{await api('/rest/v1/rpc/accept_ride',{method:'POST',body:JSON.stringify({p_ride_id:id})});setStatus('Corrida aceita.');load()}catch(e){setStatus(e.message,true)}}
async function statusRide(id,status){try{await api('/rest/v1/rpc/update_ride_status',{method:'POST',body:JSON.stringify({p_ride_id:id,p_status:status})});setStatus('Status atualizado.');load()}catch(e){setStatus(e.message,true)}}
async function loadOnlineState(){const rows=await api('/rest/v1/driver_locations?select=is_online&driver_id=eq.'+profile.id);online=Boolean(rows[0]?.is_online)}
function getPosition(){return new Promise((resolve,reject)=>{if(!navigator.geolocation)return reject(Error('Geolocalização não disponível neste dispositivo.'));navigator.geolocation.getCurrentPosition(resolve,reject,{enableHighAccuracy:true,timeout:15000,maximumAge:10000})})}
async function toggleOnline(){try{if(!driverProfile||driverProfile.status!=='active'||!driverProfile.verified)throw Error('Motorista ainda não aprovado pelo proprietário.');if(!vehicle)throw Error('Cadastre o veículo antes de ficar online.');if(online){const rows=await api('/rest/v1/driver_locations?select=latitude,longitude&driver_id=eq.'+profile.id);if(!rows[0])throw Error('Localização do motorista ainda não registrada.');await api('/rest/v1/driver_locations',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({driver_id:profile.id,latitude:rows[0].latitude,longitude:rows[0].longitude,is_online:false})});online=false;if(watch){navigator.geolocation.clearWatch(watch);watch=null}document.getElementById('onlineBtn').textContent='Ficar online';setStatus('Você está offline.');return}const p=await getPosition();await api('/rest/v1/driver_locations',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({driver_id:profile.id,latitude:p.coords.latitude,longitude:p.coords.longitude,is_online:true})});online=true;startLocation();document.getElementById('onlineBtn').textContent='Ficar offline';setStatus('Você está online.')}catch(e){setStatus(e.message,true)}}
function startLocation(){if(!navigator.geolocation||!online)return;if(watch)navigator.geolocation.clearWatch(watch);watch=navigator.geolocation.watchPosition(async p=>{try{await api('/rest/v1/driver_locations',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({driver_id:profile.id,latitude:p.coords.latitude,longitude:p.coords.longitude,is_online:true})})}catch(_){}} ,()=>{}, {enableHighAccuracy:true,maximumAge:5000,timeout:15000})}
function setStatus(t,bad=false){const e=document.getElementById('status');if(e)e.innerHTML='<div class="card '+(bad?'':'ok')+'">'+escapeHTML(t)+'</div>'}function escapeHTML(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function escapeAttr(s){return escapeHTML(s)}window.requestRide=requestRide;window.acceptRide=acceptRide;window.statusRide=statusRide;window.toggleOnline=toggleOnline;window.saveDriverOnboarding=saveDriverOnboarding;window.logout=()=>{if(watch)navigator.geolocation.clearWatch(watch);sessionStorage.clear();location.href='auth.html'};init();
</script></body></html>
