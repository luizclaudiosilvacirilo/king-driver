<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6a000"><title>King Driver</title><style>/* CSS compactado — versão de teste */body{margin:0;background:#111;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#181818}button,input,select{font:inherit}button{border:0;cursor:pointer}.app{max-width:520px;min-height:100vh;margin:auto;background:#f5f4f1}.head{height:68px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 16px}.brand{font-weight:900;font-size:20px;display:flex;align-items:center;gap:9px}.logo,.loginlogo{background:#f6a000;color:#fff;display:grid;place-items:center;font-weight:900}.logo{width:44px;height:44px;border-radius:13px;font-size:25px}.map{height:53vh;min-height:390px;position:relative;overflow:hidden;background:linear-gradient(145deg,#eeeae4,#faf8f4)}.map:before{content:"";position:absolute;inset:-30%;background:repeating-linear-gradient(20deg,transparent 0 54px,#dcd8d2 56px 59px,transparent 61px 110px),repeating-linear-gradient(110deg,transparent 0 90px,#e5e1db 92px 95px,transparent 97px 170px);transform:rotate(-6deg)}.river{position:absolute;width:130%;height:95px;left:-15%;top:20%;background:#81d8ef;transform:rotate(9deg);border-radius:50%;opacity:.8}.street,.place{position:absolute;font-size:12px;font-weight:800;color:#555}.a{top:31%;left:10%;transform:rotate(-17deg)}.b{top:56%;right:8%;transform:rotate(9deg)}.c{bottom:15%;left:24%;transform:rotate(8deg)}.p1{top:15%;right:12%}.p2{top:45%;left:13%}.p3{bottom:13%;right:15%}.mult{position:absolute;right:14%;top:34%;width:82px;height:82px;border-radius:50%;background:#ff8c70;border:1px solid #555;display:grid;place-items:center;font-weight:900}.arrow{position:absolute;left:45%;bottom:18%;font-size:52px;color:#f6a000;transform:rotate(12deg);text-shadow:0 2px #fff}.online{position:absolute;right:15px;top:15px;background:#fff;border-radius:40px;padding:9px 13px 9px 17px;display:flex;align-items:center;gap:12px;font-weight:900;color:#df9200}.dot{width:30px;height:30px;border-radius:50%;background:#19d44b}.off{background:#aaa}.ride{position:absolute;right:16px;bottom:18px;background:#f6a000;color:#fff;padding:17px 24px;border-radius:18px;font-weight:900;font-size:18px}.tools{position:absolute;left:16px;bottom:18px;display:flex;flex-direction:column;gap:8px}.tool{width:52px;height:52px;border-radius:15px;background:#fff;box-shadow:0 3px 12px #0002;font-size:22px}.gold{background:#f6a000;color:#fff}.summary{margin-top:-22px;position:relative;background:#fff;border-radius:28px 28px 0 0;padding:20px 17px 13px}.stats{display:grid;grid-template-columns:1fr 1fr;background:#f7f7f7;border-radius:20px;padding:17px}.stat{display:flex;gap:10px;align-items:center;padding:0 10px}.stat+.stat{border-left:1px solid #ddd}.stat small{display:block;color:#888;font-weight:700}.stat b,.money{color:#f6a000;font-size:20px}.tabs{height:76px;background:#fff;display:flex;justify-content:space-around;align-items:center;border-top:1px solid #eee}.tab{background:none;color:#999;font-size:23px}.tab.active{color:#f6a000}.tab small{display:block;font-size:9px;font-weight:800}.panel{padding:18px;min-height:100vh;background:#f5f4f1}.card,.item{background:#fff;border-radius:20px;padding:17px;margin:10px 0;box-shadow:0 2px 9px #0001}.field{margin:9px 0}.field label{font-size:11px;color:#666;font-weight:900;display:block;margin-bottom:5px}.field input,.field select{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;background:#fff}.primary{width:100%;padding:14px;background:#f6a000;color:#fff;border-radius:13px;font-weight:900}.secondary,.link{width:100%;padding:13px;background:#eee;border-radius:13px;font-weight:800}.link{background:none;color:#b87800}.login{min-height:100vh;padding:25px;display:flex;align-items:center;background:linear-gradient(160deg,#111,#292929)}.loginbox{background:#fff;border-radius:27px;padding:23px;width:100%}.loginlogo{width:70px;height:70px;border-radius:22px;font-size:38px;margin:auto}.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:13px 0}.choice button{padding:12px;border-radius:12px;background:#eee;font-weight:900}.choice .sel{background:#f6a000;color:#fff}.muted{color:#888;font-size:12px}.badge{float:right;background:#eee;border-radius:99px;padding:5px 8px;font-size:10px;font-weight:900}.note{padding:12px;border-radius:14px;background:#fff5df;font-size:12px;margin:10px 0}.ok{color:#18a957}.bad{color:#d83c32}.qr{display:grid;place-items:center;padding:15px;background:#fff;border-radius:18px;margin:10px 0}.qr img{width:230px;height:230px}.moneybox{font-size:34px;font-weight:900;color:#f6a000}.row{display:flex;gap:8px}.row>*{flex:1}.close,.back{background:#eee;border-radius:50%;width:40px;height:40px}@media(min-width:700px){body{padding:20px 0}.app{border-radius:28px;overflow:hidden;box-shadow:0 15px 60px #0007}}</style></head><body><div id="app"></div><script>const KEY='king-driver-demo-v5',PIX_PAYLOAD='00020126580014BR.GOV.BCB.PIX013669b085a-364d-4f17-aff1-af1fdd4432135204000053039865802BR5925Luiz Claudio Silva Cirilo6009SAO PAULO62140510X9OUHwoUrC63040C75';let S=JSON.parse(localStorage.getItem(KEY)||'null')||{users:[],rides:[],admin:null,adminPixPayload:PIX_PAYLOAD,monthly:49.90,session:null,online:true},kind='passenger';const save=()=>localStorage.setItem(KEY,JSON.stringify(S)),hash=s=>{let h=2166136261;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),16777619);return(h>>>0).toString(16)},me=()=>S.users.find(x=>x.id===S.session),money=n=>'R$ '+Number(n||0).toFixed(2).replace('.',','),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function go(x){document.getElementById('app').innerHTML=x}function login(){go(`<div class="login"><div class="loginbox"><div class="loginlogo">↗</div><h1 style="text-align:center;margin:12px 0 4px">KING DRIVER</h1><p class="muted" style="text-align:center">Mobilidade urbana • versão de testes</p><div class="choice"><button id="p" class="sel" onclick="pick('passenger')">Passageiro</button><button id="d" onclick="pick('driver')">Motorista</button></div><div class="field"><label>EMAIL OU TELEFONE</label><input id="le"></div><div class="field"><label>SENHA</label><input id="lp" type="password"></div><button class="primary" onclick="doLogin()">Entrar</button><button class="link" onclick="signup()">Criar conta</button><button class="link" onclick="adminLogin()">👑 Acesso do proprietário</button></div></div>`)}function pick(k){kind=k;document.getElementById('p').classList.toggle('sel',k==='passenger');document.getElementById('d').classList.toggle('sel',k==='driver')}function signup(){go(`<div class="login"><div class="loginbox"><button class="close" onclick="login()">×</button><div class="loginlogo">↗</div><h2>Criar conta de ${kind==='driver'?'motorista':'passageiro'}</h2><div class="field"><label>NOME COMPLETO</label><input id="sn"></div><div class="field"><label>EMAIL OU TELEFONE</label><input id="se"></div><div class="field"><label>SENHA</label><input id="sp" type="password"></div>${kind==='driver'?'<div class="field"><label>CHAVE PIX DO MOTORISTA</label><input id="sx"></div><div class="field"><label>VEÍCULO</label><input id="sv" placeholder="Honda CG 160"></div><div class="field"><label>PLACA</label><input id="st" placeholder="ABC-1D23"></div>':''}<button class="primary" onclick="createAccount()">Criar conta</button><button class="link" onclick="login()">Voltar</button></div></div>`)}function createAccount(){let n=sn.value.trim(),e=se.value.trim().toLowerCase(),pw=sp.value;if(!n||!e||pw.length<6)return alert('Preencha os dados e use senha de pelo menos 6 caracteres.');if(S.users.some(u=>u.login===e))return alert('Esse contato já está cadastrado.');let u={id:Date.now(),role:kind,name:n,login:e,pass:hash(pw),pix:kind==='driver'?sx.value.trim():'',vehicle:kind==='driver'?sv.value:'',plate:kind==='driver'?st.value:'',wallet:0,subscription:false};S.users.push(u);S.session=u.id;save();kind==='driver'?monthlyAccess():home()}function doLogin(){let e=le.value.trim().toLowerCase(),pw=hash(lp.value),u=S.users.find(x=>x.login===e&&x.pass===pw&&x.role===kind);if(!u)return alert('Conta não encontrada ou senha incorreta.');S.session=u.id;save();u.role==='driver'&&!u.subscription?monthlyAccess():home()}function monthlyAccess(){let u=me();go(`<div class="login"><div class="loginbox"><div class="loginlogo">♛</div><h2>Acesso do motorista</h2><div class="note"><b>Mensalidade de teste:</b> ${money(S.monthly)}<br>QR Pix da conta do administrador. Nesta versão, a ativação é apenas uma <b>simulação</b>.</div><div id="qr" class="qr"><img alt="QR Code Pix" src="https://api.qrserver.com/v1/create-qr-code/?size=230x230&data=${encodeURIComponent(S.adminPixPayload||PIX_PAYLOAD)}"></div><div class="card"><b>Pagamento da mensalidade</b><p>Depois do teste, use o botão somente para simular a liberação do acesso.</p><button class="primary" onclick="activateDemoSubscription()">Ativar acesso — TESTE</button></div><button class="link" onclick="logout()">Sair</button></div></div>`)}function activateDemoSubscription(){let u=me();u.subscription=true;save();home()}function logout(){S.session=null;save();login()}function home(){let u=me();if(!u)return login();let rs=S.rides.filter(r=>u.role==='driver'?r.driverId===u.id:r.passengerId===u.id);go(`<div class="head"><div class="brand"><div class="logo">↗</div>KING DRIVER</div><button class="icon" onclick="logout()">↪</button></div><section class="map"><div class="river"></div><div class="street a">Rua Beira Linha</div><div class="street b">Rua Santana</div><div class="street c">Rua São Pedro</div><div class="place p1">Rio das Velhas</div><div class="place p2">Centro</div><div class="place p3">Oeiras</div><div class="mult">1,49x</div><div class="arrow">➤</div>${u.role==='driver'?`<div class="online" onclick="toggleOnline()"><span>${S.online?'ONLINE':'OFFLINE'}</span><div class="dot ${S.online?'':'off'}"></div></div>`:''}<div class="tools"><button class="tool">＋</button><button class="tool">－</button><button class="tool gold">◈</button></div><button class="ride" onclick="newRide()">＋ ${u.role==='driver'?'Corrida':'Solicitar corrida'}</button></section><section class="summary"><h2>Olá, ${esc(u.name.split(' ')[0])}</h2><div class="stats"><div class="stat"><i>🏍</i><div><small>Corridas</small><b>${rs.length}</b></div></div><div class="stat"><i>▣</i><div><small>${u.role==='driver'?'Carteira':'Conta'}</small><b>${u.role==='driver'?money(u.wallet):'Ativa'}</b></div></div></div></section><nav class="tabs"><button class="tab active" onclick="home()">🏍<small>Início</small></button><button class="tab" onclick="rides()">▣<small>Corridas</small></button><button class="tab" onclick="profile()">♙<small>Perfil</small></button>${u.role==='driver'?'<button class="tab" onclick="monthlyAccess()">💳<small>Mensalidade</small></button>':''}</nav>`)}function toggleOnline(){S.online=!S.online;save();home()}function newRide(){let u=me();if(u.role==='driver'&&!u.subscription)return monthlyAccess();go(`<div class="panel"><button class="back" onclick="home()">←</button><h2>${u.role==='driver'?'Nova corrida':'Solicitar corrida'}</h2><div class="note">Modo de teste: nenhuma cobrança real será feita.</div><div class="field"><label>ORIGEM</label><input id="ro" value="Minha localização"></div><div class="field"><label>DESTINO</label><input id="rd" placeholder="Informe o destino"></div><div class="field"><label>VALOR DA CORRIDA</label><input id="rf" type="number" value="15.99" min="1" step="0.50"></div><div class="field"><label>PAGAMENTO</label><select id="pay"><option value="pix">PIX (simulado)</option><option value="cash">DINHEIRO (simulado)</option></select></div><button class="primary" onclick="requestRide()">Confirmar corrida</button></div>`)}function requestRide(){let u=me(),f=Number(rf.value),o=ro.value.trim(),d=rd.value.trim(),payment=pay.value;if(!o||!d||f<=0)return alert('Preencha origem, destino e valor.');let r={id:Date.now(),passengerId:u.role==='passenger'?u.id:null,driverId:u.role==='driver'?u.id:null,origin:o,destination:d,fare:f,commission:+(f*.10).toFixed(2),driverAmount:+(f*.90).toFixed(2),payment,status:u.role==='driver'?'in_progress':'requested',paid:false};S.rides.unshift(r);save();u.role==='driver'?finishRide(r.id):home()}function finishRide(id){let r=S.rides.find(x=>x.id===id);if(!r)return;let f=Number(r.fare);r.status='completed';r.completedAt=new Date().toISOString();r.commission=+(f*.10).toFixed(2);r.driverAmount=+(f*.90).toFixed(2);let u=me();u.wallet=+(Number(u.wallet||0)+r.driverAmount).toFixed(2);save();go(`<div class="panel"><div class="card" style="text-align:center"><div style="font-size:54px">✓</div><h2>Corrida concluída</h2><p>Origem: ${esc(r.origin)}</p><p>Destino: ${esc(r.destination)}</p><div class="moneybox">${money(f)}</div><p class="ok"><b>Comissão King Driver: ${money(r.commission)}</b></p><p>Parcela do motorista: <b>${money(r.driverAmount)}</b></p><p class="muted">Modo de teste: nenhum dinheiro real foi movimentado.</p><button class="primary" onclick="home()">Voltar ao início</button></div></div>`)}function rides(){let u=me(),rs=S.rides.filter(r=>u.role==='driver'?r.driverId===u.id:r.passengerId===u.id);go(`<div class="panel"><button class="back" onclick="home()">←</button><h2>Minhas corridas</h2>${rs.length?rs.map(r=>`<div class="item"><span class="badge">${r.status==='completed'?'CONCLUÍDA':'SOLICITADA'}</span><b>${esc(r.origin)} → ${esc(r.destination)}</b><p>${money(r.fare)} • ${r.payment==='pix'?'PIX':'DINHEIRO'}</p>${r.status!=='completed'&&u.role==='driver'?`<button class="primary" onclick="finishRide(${r.id})">Finalizar corrida</button>`:''}</div>`).join(''):'<div class="card">Nenhuma corrida ainda.</div>'}</div>`)}function profile(){let u=me();go(`<div class="panel"><button class="back" onclick="home()">←</button><h2>Perfil</h2><div class="card"><b>${esc(u.name)}</b><p>${esc(u.login)}</p><p>Tipo: ${u.role==='driver'?'Motorista parceiro':'Passageiro'}</p>${u.role==='driver'?`<p>Veículo: ${esc(u.vehicle||'Não informado')} • ${esc(u.plate||'')}</p><p>Mensalidade: <b class="${u.subscription?'ok':'bad'}">${u.subscription?'ATIVA (TESTE)':'PENDENTE'}</b></p><button class="secondary" onclick="monthlyAccess()">Ver QR da mensalidade</button>`:''}</div><button class="primary" onclick="logout()">Sair</button></div>`)}function adminLogin(){go(`<div class="login"><div class="loginbox"><button class="close" onclick="login()">×</button><div class="loginlogo">♛</div><h2>Proprietário</h2>${S.admin?`<div class="field"><label>SENHA DO PROPRIETÁRIO</label><input id="ap" type="password"></div><button class="primary" onclick="checkAdmin()">Entrar</button>`:`<div class="note"><b>Primeiro acesso:</b> crie uma senha de proprietário. Nesta versão de teste ela fica neste navegador.</div><div class="field"><label>CRIAR SENHA</label><input id="ap" type="password"></div><div class="field"><label>CONFIRMAR SENHA</label><input id="ap2" type="password"></div><button class="primary" onclick="createAdmin()">Criar senha</button>`}<button class="link" onclick="login()">Voltar</button></div></div>`)}function createAdmin(){let a=ap.value,b=ap2.value;if(a.length<8||a!==b)return alert('Use pelo menos 8 caracteres e confirme a senha.');S.admin=hash(a);save();owner()}function checkAdmin(){if(hash(ap.value)!==S.admin)return alert('Senha incorreta.');owner()}function owner(){go(`<div class="panel"><button class="back" onclick="logout()">←</button><h2>Painel do proprietário</h2><div class="card"><h3>Mensalidade do motorista</h3><div class="field"><label>VALOR DE TESTE</label><input id="mv" type="number" step="0.01" value="${S.monthly}"></div><button class="primary" onclick="saveMonthly()">Salvar valor</button></div><div class="card"><h3>Motoristas</h3>${S.users.filter(u=>u.role==='driver').map(u=>`<div class="item"><b>${esc(u.name)}</b><p>${esc(u.login)}</p><span class="badge">${u.subscription?'ATIVO':'PENDENTE'}</span></div>`).join('')||'<p>Nenhum motorista cadastrado.</p>'}</div><div class="card"><h3>Resumo</h3><p>Corridas: <b>${S.rides.length}</b></p><p>Comissões de 10% (teste): <b>${money(S.rides.reduce((a,r)=>a+Number(r.commission||0),0))}</b></p></div></div>`)}function saveMonthly(){let v=Number(mv.value);if(v<=0)return alert('Informe um valor válido.');S.monthly=v;save();alert('Mensalidade atualizada.');owner()}login();</script></body></html>
