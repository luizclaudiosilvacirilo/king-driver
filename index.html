<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6a000"><title>King Driver</title><style>:root{--g:#f6a000;--bg:#f5f4f1}*{box-sizing:border-box}body{margin:0;background:#111;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#181818}.app{max-width:520px;min-height:100vh;margin:auto;background:var(--bg)}button,input,select{font:inherit}button{border:0;cursor:pointer}.head{height:68px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 16px}.brand{font-weight:900;font-size:20px;display:flex;align-items:center;gap:9px}.logo{width:44px;height:44px;border-radius:13px;background:var(--g);color:#fff;display:grid;place-items:center;font-size:25px}.icon,.close,.back{background:#eee;border-radius:50%;width:40px;height:40px}.map{height:53vh;min-height:390px;position:relative;overflow:hidden;background:linear-gradient(145deg,#eeeae4,#faf8f4)}.map:before{content:"";position:absolute;inset:-30%;background:repeating-linear-gradient(20deg,transparent 0 54px,#dcd8d2 56px 59px,transparent 61px 110px),repeating-linear-gradient(110deg,transparent 0 90px,#e5e1db 92px 95px,transparent 97px 170px);transform:rotate(-6deg)}.river{position:absolute;width:130%;height:95px;left:-15%;top:20%;background:#81d8ef;transform:rotate(9deg);border-radius:50%;opacity:.8}.street,.place{position:absolute;font-size:12px;font-weight:800;color:#555}.a{top:31%;left:10%;transform:rotate(-17deg)}.b{top:56%;right:8%;transform:rotate(9deg)}.c{bottom:15%;left:24%;transform:rotate(8deg)}.p1{top:15%;right:12%}.p2{top:45%;left:13%}.p3{bottom:13%;right:15%}.mult{position:absolute;right:14%;top:34%;width:82px;height:82px;border-radius:50%;background:#ff8c70;border:1px solid #555;display:grid;place-items:center;font-weight:900}.arrow{position:absolute;left:45%;bottom:18%;font-size:52px;color:var(--g);transform:rotate(12deg);text-shadow:0 2px #fff}.online{position:absolute;right:15px;top:15px;background:#fff;border-radius:40px;padding:9px 13px 9px 17px;display:flex;align-items:center;gap:12px;font-weight:900;color:#df9200}.dot{width:30px;height:30px;border-radius:50%;background:#19d44b}.off{background:#aaa}.ride{position:absolute;right:16px;bottom:18px;background:var(--g);color:#fff;padding:17px 24px;border-radius:18px;font-weight:900;font-size:18px}.tools{position:absolute;left:16px;bottom:18px;display:flex;flex-direction:column;gap:8px}.tool{width:52px;height:52px;border-radius:15px;background:#fff;box-shadow:0 3px 12px #0002;font-size:22px}.gold{background:var(--g);color:#fff}.summary{margin-top:-22px;position:relative;background:#fff;border-radius:28px 28px 0 0;padding:20px 17px 13px}.summary h2{font-size:20px}.stats{display:grid;grid-template-columns:1fr 1fr;background:#f7f7f7;border-radius:20px;padding:17px}.stat{display:flex;gap:10px;align-items:center;padding:0 10px}.stat+ .stat{border-left:1px solid #ddd}.stat small{display:block;color:#888;font-weight:700}.stat b,.price{color:var(--g);font-size:20px}.tabs{height:76px;background:#fff;display:flex;justify-content:space-around;align-items:center;border-top:1px solid #eee}.tab{background:none;color:#999;font-size:23px}.tab.active{color:var(--g)}.tab small{display:block;font-size:9px;font-weight:800}.panel{padding:18px;min-height:100vh;background:var(--bg)}.card,.item{background:#fff;border-radius:20px;padding:17px;margin:10px 0;box-shadow:0 2px 9px #0001}.field{margin:9px 0}.field label{font-size:11px;color:#666;font-weight:900;display:block;margin-bottom:5px}.field input,.field select{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;background:#fff}.primary{width:100%;padding:14px;background:var(--g);color:#fff;border-radius:13px;font-weight:900}.secondary,.link{width:100%;padding:13px;background:#eee;border-radius:13px;font-weight:800}.link{background:none;color:#b87800}.login{min-height:100vh;padding:25px;display:flex;align-items:center;background:linear-gradient(160deg,#111,#292929)}.loginbox{background:#fff;border-radius:27px;padding:23px;width:100%}.loginlogo{width:70px;height:70px;border-radius:22px;background:var(--g);color:#fff;display:grid;place-items:center;font-size:38px;margin:auto}.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:13px 0}.choice button{padding:12px;border-radius:12px;background:#eee;font-weight:900}.choice .sel{background:var(--g);color:#fff}.muted{color:#888;font-size:12px}.badge{float:right;background:#eee;border-radius:99px;padding:5px 8px;font-size:10px;font-weight:900}.row{display:flex;gap:8px}.row>*{flex:1}.note{padding:12px;border-radius:14px;background:#fff5df;font-size:12px;margin:10px 0}.hidden{display:none}@media(min-width:700px){body{padding:20px 0}.app{border-radius:28px;overflow:hidden;box-shadow:0 15px 60px #0007}}</style></head><body><div id="app"></div><script>
const KEY='king-driver-basic-v3';let S=JSON.parse(localStorage.getItem(KEY)||'null')||{users:[],rides:[],admin:null,session:null,online:true};let kind='passenger';const save=()=>localStorage.setItem(KEY,JSON.stringify(S));const hash=s=>{let h=0;for(let i=0;i<s.length;i++)h=((h<<5)-h+s.charCodeAt(i))|0;return''+h};const me=()=>S.users.find(x=>x.id===S.session);const money=n=>'R$ '+Number(n||0).toFixed(2).replace('.',',');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function login(){document.getElementById('app').innerHTML=`<div class="login"><div class="loginbox"><div class="loginlogo">↗</div><h1 style="text-align:center;margin:12px 0 4px">KING DRIVER</h1><p class="muted" style="text-align:center">Mobilidade urbana</p><div class="choice"><button id="p" class="sel" onclick="pick('passenger')">Passageiro</button><button id="d" onclick="pick('driver')">Motorista</button></div><div class="field"><label>EMAIL OU TELEFONE</label><input id="le"></div><div class="field"><label>SENHA</label><input id="lp" type="password"></div><button class="primary" onclick="doLogin()">Entrar</button><button class="link" onclick="signup()">Criar conta</button><button class="link" onclick="adminLogin()">Acesso do proprietário</button></div></div>`}function pick(k){kind=k;document.getElementById('p').classList.toggle('sel',k==='passenger');document.getElementById('d').classList.toggle('sel',k==='driver')}function signup(){document.getElementById('app').innerHTML=`<div class="login"><div class="loginbox"><button class="close" onclick="login()">×</button><div class="loginlogo">↗</div><h2>Criar conta de ${kind==='driver'?'motorista':'passageiro'}</h2><div class="field"><label>NOME COMPLETO</label><input id="sn"></div><div class="field"><label>EMAIL OU TELEFONE</label><input id="se"></div><div class="field"><label>SENHA</label><input id="sp" type="password"></div>${kind==='driver'?'<div class="field"><label>VEÍCULO</label><input id="sv" placeholder="Honda CG 160"></div><div class="field"><label>PLACA</label><input id="st" placeholder="ABC-1D23"></div>':''}<button class="primary" onclick="createAccount()">Criar conta</button><button class="link" onclick="login()">Voltar</button></div></div>`}function createAccount(){let n=document.getElementById('sn').value.trim(),e=document.getElementById('se').value.trim().toLowerCase(),p=document.getElementById('sp').value;if(!n||!e||p.length<4)return alert('Preencha os dados e use senha de pelo menos 4 caracteres.');if(S.users.some(u=>u.login===e))return alert('Esse contato já está cadastrado.');let u={id:Date.now(),role:kind,name:n,login:e,pass:hash(p),vehicle:kind==='driver'?document.getElementById('sv').value:'',plate:kind==='driver'?document.getElementById('st').value:''};S.users.push(u);S.session=u.id;save();home()}function doLogin(){let e=document.getElementById('le').value.trim().toLowerCase(),p=hash(document.getElementById('lp').value),u=S.users.find(x=>x.login===e&&x.pass===p&&x.role===kind);if(!u)return alert('Conta não encontrada ou senha incorreta.');S.session=u.id;save();home()}function adminLogin(){document.getElementById('app').innerHTML=`<div class="login"><div class="loginbox"><button class="close" onclick="login()">×</button><div class="loginlogo">♛</div><h2>Proprietário</h2>${S.admin?`<div class="field"><label>SENHA DO PROPRIETÁRIO</label><input id="ap" type="password"></div><button class="primary" onclick="checkAdmin()">Entrar</button>`:`<div class="note"><b>Primeiro acesso:</b> crie aqui a sua senha de proprietário.</div><div class="field"><label>CRIAR SENHA</label><input id="ap" type="password"></div><div class="field"><label>CONFIRMAR SENHA</label><input id="ap2" type="password"></div><button class="primary" onclick="createAdmin()">Criar senha</button>`}<button class="link" onclick="login()">Voltar</button></div></div>`}function createAdmin(){let a=document.getElementById('ap').value,b=document.getElementById('ap2').value;if(a.length<6||a!==b)return alert('Use pelo menos 6 caracteres e confirme a senha.');S.admin=hash(a);save();owner()}function checkAdmin(){if(hash(document.getElementById('ap').value)!==S.admin)return alert('Senha incorreta.');owner()}function logout(){S.session=null;save();login()}
function home(){let u=me();if(!u)return login();let rs=S.rides.filter(r=>u.role==='driver'?r.driverId===u.id:r.passengerId===u.id);document.getElementById('app').innerHTML=`<div class="head"><div class="brand"><div class="logo">↗</div>KING DRIVER</div><button class="icon" onclick="logout()">↪</button></div><section class="map"><div class="river"></div><div class="street a">Rua Beira Linha</div><div class="street b">Rua Santana</div><div class="street c">Rua São Pedro</div><div class="place p1">Rio das Velhas</div><div class="place p2">Centro</div><div class="place p3">Oeiras</div><div class="mult">1.49x</div><div class="arrow">➤</div>${u.role==='driver'?`<div class="online" onclick="toggleOnline()"><span>${S.online?'ONLINE':'OFFLINE'}</span><div class="dot ${S.online?'':'off'}"></div></div>`:''}<div class="tools"><button class="tool">＋</button><button class="tool">－</button><button class="tool gold">◈</button></div><button class="ride" onclick="newRide()">＋ ${u.role==='driver'?'Corrida':'Solicitar corrida'}</button></section><section class="summary"><h2>Olá, ${esc(u.name.split(' ')[0])}</h2><div class="stats"><div class="stat"><i>🏍</i><div><small>Corridas</small><b>${rs.length}</b></div></div><div class="stat"><i>▣</i><div><small>${u.role==='driver'?'Ganhos':'Conta'}</small><b>${u.role==='driver'?money(rs.filter(r=>r.status==='completed').reduce((a,r)=>a+r.driverAmount,0)):'Ativa'}</b></div></div></div></section><nav class="tabs"><button class="tab active" onclick="home()">🏍<small>Início</small></button><button class="tab" onclick="rides()">▣<small>Corridas</small></button><button class="tab" onclick="profile()">♙<small>Perfil</small></button>${u.role==='driver'?'<button class="tab" onclick="offers()">☆<small>Ofertas</small></button>':''}</nav>`}function newRide(){let u=me();document.getElementById('app').insertAdjacentHTML('beforeend',`<div class="login" id="m"><div class="loginbox"><button class="close" onclick="m.remove()">×</button><h2>${u.role==='driver'?'Registrar corrida':'Solicitar corrida'}</h2><div class="field"><label>ORIGEM</label><input id="ro" value="Minha localização"></div><div class="field"><label>DESTINO</label><input id="rd" placeholder="Informe o destino"></div><div class="field"><label>VALOR</label><input id="rf" type="number" value="15.99" min="1" step="0.50"></div>${u.role==='passenger'?'<div class="field"><label>CATEGORIA</label><select id="rc"><option>Moto</option><option>Econômico</option><option>Conforto</option></select></div>':''}<button class="primary" onclick="makeRide()">${u.role==='driver'?'Registrar corrida':'Solicitar corrida'}</button></div></div>`)}function makeRide(){let u=me(),f=Number(rf.value),o=ro.value.trim(),d=rd.value.trim();if(!o||!d||f<=0)return alert('Preencha origem, destino e valor.');let r={id:Date.now(),passengerId:u.role==='passenger'?u.id:null,driverId:u.role==='driver'?u.id:null,origin:o,destination:d,fare:f,commission:f*.10,driverAmount:f*.90,status:u.role==='passenger'?'requested':'completed',category:document.getElementById('rc')?.value||'Moto'};S.rides.unshift(r);save();m.remove();home();alert('Corrida criada. 10% da plataforma: '+money(r.commission))}function offers(){let rs=S.rides.filter(r=>r.status==='requested');document.getElementById('app').innerHTML=`<div class="panel"><button class="back" onclick="home()">×</button><h2>Ofertas</h2>${rs.length?rs.map(r=>`<div class="item"><span class="badge">${esc(r.category)}</span><b>${esc(r.origin)}</b><div class="muted">↓ ${esc(r.destination)}</div><div class="price">${money(r.fare)}</div><button class="primary" onclick="accept(${r.id})">Aceitar</button></div>`).join(''):'<div class="card">Nenhuma corrida disponível.</div>'}</div>`}function accept(id){let r=S.rides.find(x=>x.id===id),u=me();if(!r||r.driverId)return alert('Corrida indisponível.');r.driverId=u.id;r.status='accepted';save();home();alert('Aceita. Motorista: '+money(r.driverAmount)+' | Plataforma: '+money(r.commission))}function rides(){let u=me(),rs=S.rides.filter(r=>u.role==='driver'?r.driverId===u.id:r.passengerId===u.id);document.getElementById('app').innerHTML=`<div class="panel"><button class="back" onclick="home()">×</button><h2>Minhas corridas</h2>${rs.length?rs.map(r=>`<div class="item"><span class="badge">${r.status}</span><b>${esc(r.origin)}</b><div class="muted">↓ ${esc(r.destination)}</div><div class="price">${money(r.fare)}</div>${u.role==='driver'?`<div class="muted">Sua parte 90%: ${money(r.driverAmount)} · Plataforma 10%: ${money(r.commission)}</div>`:''}</div>`).join(''):'<div class="card">Nenhuma corrida.</div>'}</div>`}function profile(){let u=me();document.getElementById('app').innerHTML=`<div class="panel"><button class="back" onclick="home()">×</button><h2>Meu perfil</h2><div class="card"><b>${esc(u.name)}</b><p class="muted">${esc(u.login)}</p><p>Tipo: <b>${u.role==='driver'?'Motorista':'Passageiro'}</b></p>${u.role==='driver'?`<p>Veículo: ${esc(u.vehicle||'Não informado')}<br>Placa: ${esc(u.plate||'Não informada')}</p>`:''}</div><button class="secondary" onclick="logout()">Sair</button></div>`}function toggleOnline(){S.online=!S.online;save();home()}function owner(){let total=S.rides.reduce((a,r)=>a+r.commission,0);document.getElementById('app').innerHTML=`<div class="panel"><button class="back" onclick="login()">×</button><h2>👑 Painel do proprietário</h2><div class="card"><div class="muted">Sua comissão exclusiva — 10%</div><div style="font-size:38px;font-weight:900;color:var(--g)">${money(total)}</div><div class="muted">${S.rides.length} corrida(s)</div></div><div class="card"><b>Total movimentado</b><h2>${money(S.rides.reduce((a,r)=>a+r.fare,0))}</h2><b>Seu 10%</b><h2 style="color:var(--g)">${money(total)}</h2></div><div class="card">Passageiros: ${S.users.filter(u=>u.role==='passenger').length}<br>Motoristas: ${S.users.filter(u=>u.role==='driver').length}</div><div class="note"><b>Acesso:</b> este painel exige a senha de proprietário criada no primeiro acesso.</div><button class="secondary" onclick="logout()">Sair</button></div>`}login();</script></body></html>
