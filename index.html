<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>King Driver</title><style>body{margin:0;background:#090909;color:#fff;font-family:system-ui}.app{max-width:520px;margin:auto;padding:20px}.brand{text-align:center;font-size:27px;font-weight:900;margin:12px}.brand span{color:#d4af37}.card{background:#151515;border:1px solid #292929;border-radius:16px;padding:16px;margin:12px 0}input,select,button{width:100%;padding:13px;margin:7px 0;box-sizing:border-box;border-radius:10px;border:1px solid #333;background:#0d0d0d;color:#fff}button{font-weight:800;cursor:pointer}.gold{background:#d4af37;color:#111;border:0}.danger{background:#3b1818;color:#ff9999}.muted{color:#aaa;font-size:13px}.price{font-size:30px;color:#d4af37;font-weight:900}.ride{border:1px solid #333;border-radius:12px;padding:12px;margin:8px 0}.ok{color:#54db8d}.top{display:flex;justify-content:space-between;align-items:center}.top button{width:auto;padding:8px 12px}</style></head><body><div class="app"><div class="brand">♛ KING <span>DRIVER</span></div><div id="root"></div></div><script type="module">
import './js/config.js';
const U=window.KING_DRIVER_SUPABASE_URL,K=window.KING_DRIVER_SUPABASE_PUBLISHABLE_KEY,T=()=>sessionStorage.getItem('king_driver_access_token')||'';const root=document.getElementById('root');let profile=null,rides=[],watch=null;
function currentUserId(){const token=T();if(!token)return '';try{const part=token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(atob(part)).sub||''}catch(_){return ''}}
async function api(path,opt={}){if(!T())throw Error('Sessão expirada. Faça login novamente.');const r=await fetch(U+path,{...opt,headers:{apikey:K,Authorization:`Bearer ${T()}`,'Content-Type':'application/json',...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||d.msg||d.error_description||'Erro no servidor');return d}
async function init(){if(!T()){location.href='auth.html';return}try{const [p]=await api('/rest/v1/profiles?select=*&id=eq.'+encodeURIComponent(currentUserId()));profile=p;if(!profile)throw Error('Perfil não encontrado.');render();await load();setInterval(load,4000);if(profile.role==='driver')startLocation();}catch(e){root.innerHTML='<div class="card">'+e.message+'<button onclick="location.href=\'auth.html\'">Voltar ao acesso</button></div>'}}
function render(){root.innerHTML=`<div class="top"><div><b>Olá, ${profile.full_name||(profile.role==='driver'?'Motorista':'Passageiro')}</b><div class="muted">Modo ${profile.role==='driver'?'motorista':'passageiro'}</div></div><button onclick="logout()">Sair</button></div>`+(profile.role==='driver'?driverUI():passengerUI())+`<div id="status"></div>`}
function passengerUI(){return `<div class="card"><h2>Solicitar corrida</h2><input id="origin" placeholder="Origem" value="São Sebastião do Paraíso, MG"><input id="destination" placeholder="Destino"><select id="category"><option value="economy">Econômico</option><option value="comfort">Conforto</option><option value="premium">Premium</option></select><input id="price" type="number" min="1" step="0.50" value="18.50"><button class="gold" onclick="requestRide()">Solicitar corrida</button></div><div class="card"><h3>Minhas corridas</h3><div id="rides"></div></div>`}
function driverUI(){return `<div class="card"><h2>Central do motorista</h2><button class="gold" onclick="toggleOnline()" id="onlineBtn">Ficar online</button><div class="muted">Corridas solicitadas aparecem quando você estiver online.</div></div><div class="card"><h3>Corridas disponíveis / minhas corridas</h3><div id="rides"></div></div>`}
async function load(){if(!profile)return;try{rides=profile.role==='driver'?await api('/rest/v1/rides?select=*&or=(status.eq.requested,driver_id.eq.'+encodeURIComponent(profile.id)+')&order=created_at.desc&limit=20'):await api('/rest/v1/rides?select=*&passenger_id=eq.'+encodeURIComponent(profile.id)+'&order=created_at.desc&limit=20');const el=document.getElementById('rides');if(!el)return;el.innerHTML=rides.length?rides.map(r=>rideHTML(r)).join(''):'<div class="muted">Nenhuma corrida ainda.</div>';}catch(e){setStatus(e.message,true)}}
function rideHTML(r){let actions='';if(profile.role==='driver'&&r.status==='requested')actions=`<button class="gold" onclick="acceptRide('${r.id}')">Aceitar corrida</button>`;if(profile.role==='driver'&&r.driver_id===profile.id){if(r.status==='accepted')actions=`<button onclick="statusRide('${r.id}','arriving')">Estou a caminho</button>`;else if(r.status==='arriving')actions=`<button onclick="statusRide('${r.id}','in_progress')">Iniciar corrida</button>`;else if(r.status==='in_progress')actions=`<button class="gold" onclick="statusRide('${r.id}','completed')">Finalizar corrida</button>`}if(profile.role==='passenger'&&['requested','accepted','arriving'].includes(r.status))actions=`<button class="danger" onclick="statusRide('${r.id}','cancelled')">Cancelar</button>`;return `<div class="ride"><b>${r.pickup_address||''}</b> → <b>${r.destination_address||''}</b><div class="muted">${r.category||''} · ${r.status}</div><div class="price">R$ ${Number(r.final_fare??r.offered_fare??0).toFixed(2)}</div>${actions}</div>`}
async function requestRide(){try{const origin=document.getElementById('origin').value.trim(),destination=document.getElementById('destination').value.trim(),price=Number(document.getElementById('price').value),category=document.getElementById('category').value;if(!origin||!destination||!price)throw Error('Preencha origem, destino e valor.');await api('/rest/v1/rides',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({passenger_id:profile.id,pickup_address:origin,destination_address:destination,category,offered_fare:price,status:'requested'})});setStatus('Corrida solicitada com sucesso.');load()}catch(e){setStatus(e.message,true)}}
async function acceptRide(id){try{await api('/rest/v1/rpc/accept_ride',{method:'POST',body:JSON.stringify({p_ride_id:id})});setStatus('Corrida aceita.');load()}catch(e){setStatus(e.message,true)}}
async function statusRide(id,status){try{await api('/rest/v1/rpc/update_ride_status',{method:'POST',body:JSON.stringify({p_ride_id:id,p_status:status})});setStatus('Status atualizado.');load()}catch(e){setStatus(e.message,true)}}
async function toggleOnline(){try{const existing=await api('/rest/v1/driver_locations?select=is_online&driver_id=eq.'+profile.id);const online=!(existing[0]?.is_online);await api('/rest/v1/driver_locations',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({driver_id:profile.id,is_online:online})});document.getElementById('onlineBtn').textContent=online?'Ficar offline':'Ficar online';setStatus(online?'Você está online.':'Você está offline.')}catch(e){setStatus(e.message,true)}}
function startLocation(){if(!navigator.geolocation)return;if(watch)navigator.geolocation.clearWatch(watch);watch=navigator.geolocation.watchPosition(async p=>{try{await api('/rest/v1/driver_locations',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({driver_id:profile.id,latitude:p.coords.latitude,longitude:p.coords.longitude,is_online:true})})}catch(_){}})}
function setStatus(t,bad=false){const e=document.getElementById('status');if(e)e.innerHTML='<div class="card '+(bad?'':'ok')+'">'+t+'</div>'}window.requestRide=requestRide;window.acceptRide=acceptRide;window.statusRide=statusRide;window.toggleOnline=toggleOnline;window.logout=()=>{sessionStorage.clear();location.href='auth.html'};init();
</script></body></html>
