<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6a000"><title>King Driver</title><style>:root{--g:#f6a000;--bg:#f5f4f1;--dark:#181818;--mut:#777;--ok:#16c94a;--bad:#d83c32}*{box-sizing:border-box}body{margin:0;background:#111;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--dark)}button,input,select{font:inherit}button{border:0;cursor:pointer}.app{max-width:520px;min-height:100vh;margin:auto;background:var(--bg)}.head{height:68px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 16px}.brand{font-weight:900;font-size:20px;display:flex;align-items:center;gap:9px}.logo{width:44px;height:44px;border-radius:13px;background:var(--g);color:#fff;display:grid;place-items:center;font-size:25px}.icon,.close,.back{background:#eee;border-radius:50%;width:40px;height:40px}.map{height:51vh;min-height:390px;position:relative;overflow:hidden;background:linear-gradient(145deg,#eeeae4,#faf8f4)}.map:before{content:"";position:absolute;inset:-30%;background:repeating-linear-gradient(20deg,transparent 0 54px,#dcd8d2 56px 59px,transparent 61px 110px),repeating-linear-gradient(110deg,transparent 0 90px,#e5e1db 92px 95px,transparent 97px 170px);transform:rotate(-6deg)}.river{position:absolute;width:130%;height:95px;left:-15%;top:20%;background:#81d8ef;transform:rotate(9deg);border-radius:50%;opacity:.8}.street,.place{position:absolute;font-size:12px;font-weight:800;color:#555}.a{top:31%;left:10%;transform:rotate(-17deg)}.b{top:56%;right:8%;transform:rotate(9deg)}.c{bottom:15%;left:24%;transform:rotate(8deg)}.p1{top:15%;right:12%}.p2{top:45%;left:13%}.p3{bottom:13%;right:15%}.mult{position:absolute;right:14%;top:34%;width:82px;height:82px;border-radius:50%;background:#ff8c70;border:1px solid #555;display:grid;place-items:center;font-weight:900}.arrow{position:absolute;left:45%;bottom:18%;font-size:52px;color:var(--g);transform:rotate(12deg);text-shadow:0 2px #fff}.online{position:absolute;right:15px;top:15px;background:#fff;border-radius:40px;padding:9px 13px 9px 17px;display:flex;align-items:center;gap:12px;font-weight:900;color:#df9200}.dot{width:30px;height:30px;border-radius:50%;background:#19d44b}.off{background:#aaa}.ride{position:absolute;right:16px;bottom:18px;background:var(--g);color:#fff;padding:17px 24px;border-radius:18px;font-weight:900;font-size:18px}.tools{position:absolute;left:16px;bottom:18px;display:flex;flex-direction:column;gap:8px}.tool{width:52px;height:52px;border-radius:15px;background:#fff;box-shadow:0 3px 12px #0002;font-size:22px}.gold{background:var(--g);color:#fff}.summary{margin-top:-22px;position:relative;background:#fff;border-radius:28px 28px 0 0;padding:20px 17px 13px}.stats{display:grid;grid-template-columns:1fr 1fr;background:#f7f7f7;border-radius:20px;padding:17px}.stat{display:flex;gap:10px;align-items:center;padding:0 10px}.stat+ .stat{border-left:1px solid #ddd}.stat small{display:block;color:#888;font-weight:700}.stat b,.price{color:var(--g);font-size:20px}.tabs{height:76px;background:#fff;display:flex;justify-content:space-around;align-items:center;border-top:1px solid #eee}.tab{background:none;color:#999;font-size:23px}.tab.active{color:var(--g)}.tab small{display:block;font-size:9px;font-weight:800}.panel{padding:18px;min-height:100vh;background:var(--bg)}.card,.item{background:#fff;border-radius:20px;padding:17px;margin:10px 0;box-shadow:0 2px 9px #0001}.field{margin:9px 0}.field label{font-size:11px;color:#666;font-weight:900;display:block;margin-bottom:5px}.field input,.field select{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;background:#fff}.primary{width:100%;padding:14px;background:var(--g);color:#fff;border-radius:13px;font-weight:900}.secondary,.link{width:100%;padding:13px;background:#eee;border-radius:13px;font-weight:800}.link{background:none;color:#b87800}.login{min-height:100vh;padding:25px;display:flex;align-items:center;background:linear-gradient(160deg,#111,#292929)}.loginbox{background:#fff;border-radius:27px;padding:23px;width:100%}.loginlogo{width:70px;height:70px;border-radius:22px;background:var(--g);color:#fff;display:grid;place-items:center;font-size:38px;margin:auto}.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:13px 0}.choice button{padding:12px;border-radius:12px;background:#eee;font-weight:900}.choice .sel{background:var(--g);color:#fff}.muted{color:#888;font-size:12px}.badge{float:right;background:#eee;border-radius:99px;padding:5px 8px;font-size:10px;font-weight:900}.note{padding:12px;border-radius:14px;background:#fff5df;font-size:12px;margin:10px 0}.ok{color:var(--ok)}.bad{color:var(--bad)}.hidden{display:none}.qr{display:grid;place-items:center;padding:15px;background:#fff;border-radius:18px;margin:10px 0}.qr canvas,.qr img{max-width:230px}.moneybox{font-size:34px;font-weight:900;color:var(--g)}.row{display:flex;gap:8px}.row>*{flex:1}@media(min-width:700px){body{padding:20px 0}.app{border-radius:28px;overflow:hidden;box-shadow:0 15px 60px #0007}}</style></head><body><div id="app"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>
const KEY='king-driver-basic-v4';let S=JSON.parse(localStorage.getItem(KEY)||'null')||{users:[],rides:[],admin:null,adminPix:'',session:null,online:true};let kind='passenger';const save=()=>localStorage.setItem(KEY,JSON.stringify(S));const hash=s=>{let h=2166136261;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),16777619);return(h>>>0).toString(16)};const me=()=>S.users.find(x=>x.id===S.session);const money=n=>'R$ '+Number(n||0).toFixed(2).replace('.',',');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function login(){document.getElementById('app').innerHTML=`<div class="login"><div class="loginbox"><div class="loginlogo">↗</div><h1 style="text-align:center;margin:12px 0 4px">KING DRIVER</h1><p class="muted" style="text-align:center">Mobilidade urbana</p><div class="choice"><button id="p" class="sel" onclick="pick('passenger')">Passageiro</button><button id="d" onclick="pick('driver')">Motorista</button></div><div class="field"><label>EMAIL OU TELEFONE</label><input id="le"></div><div class="field"><label>SENHA</label><input id="lp" type="password"></div><button class="primary" onclick="doLogin()">Entrar</button><button class="link" onclick="signup()">Criar conta</button><button class="link" onclick="adminLogin()">👑 Acesso do proprietário</button></div></div>`}function pick(k){kind=k;p.classList.toggle('sel',k==='passenger');d.classList.toggle('sel',k==='driver')}function signup(){document.getElementById('app').innerHTML=`<div class="login"><div class="loginbox"><button class="close" onclick="login()">×</button><div class="loginlogo">↗</div><h2>Criar conta de ${kind==='driver'?'motorista':'passageiro'}</h2><div class="field"><label>NOME COMPLETO</label><input id="sn"></div><div class="field"><label>EMAIL OU TELEFONE</label><input id="se"></div><div class="field"><label>SENHA</label><input id="sp" type="password"></div>${kind==='driver'?'<div class="field"><label>PIX DO MOTORISTA (chave)</label><input id="sx" placeholder="CPF, telefone, e-mail ou chave aleatória"></div><div class="field"><label>VEÍCULO</label><input id="sv" placeholder="Honda CG 160"></div><div class="field"><label>PLACA</label><input id="st" placeholder="ABC-1D23"></div>':''}<button class="primary" onclick="createAccount()">Criar conta</button><button class="link" onclick="login()">Voltar</button></div></div>`}function createAccount(){let n=sn.value.trim(),e=se.value.trim().toLowerCase(),p=sp.value;if(!n||!e||p.length<6)return alert('Preencha os dados e use senha de pelo menos 6 caracteres.');if(S.users.some(u=>u.login===e))return alert('Esse contato já está cadastrado.');let u={id:Date.now(),role:kind,name:n,login:e,pass:hash(p),pix:kind==='driver'?sx.value.trim():'',vehicle:kind==='driver'?sv.value:'',plate:kind==='driver'?st.value:'' ,wallet:0};S.users.push(u);S.session=u.id;save();home()}function doLogin(){let e=le.value.trim().toLowerCase(),p=hash(lp.value),u=S.users.find(x=>x.login===e&&x.pass===p&&x.role===kind);if(!u)return alert('Conta não encontrada ou senha incorreta.');S.session=u.id;save();home()}function adminLogin(){document.getElementById('app').innerHTML=`<div class="login"><div class="loginbox"><button class="close" onclick="login()">×</button><div class="loginlogo">♛</div><h2>Proprietário</h2>${S.admin?`<div class="field"><label>SENHA DO PROPRIETÁRIO</label><input id="ap" type="password"></div><button class="primary" onclick="checkAdmin()">Entrar</button>`:`<div class="note"><b>Primeiro acesso:</b> crie sua senha de proprietário. Não compartilhe essa senha.</div><div class="field"><label>CRIAR SENHA</label><input id="ap" type="password"></div><div class="field"><label>CONFIRMAR SENHA</label><input id="ap2" type="password"></div><button class="primary" onclick="createAdmin()">Criar senha</button>`}<button class="link" onclick="login()">Voltar</button></div></div>`}function createAdmin(){let a=ap.value,b=ap2.value;if(a.length<8||a!==b)return alert('Use pelo menos 8 caracteres e confirme a senha.');S.admin=hash(a);save();owner()}function checkAdmin(){if(hash(ap.value)!==S.admin)return alert('Senha incorreta.');owner()}function logout(){S.session=null;save();login()}
function home(){let u=me();if(!u)return login();let rs=S.rides.filter(r=>u.role==='driver'?r.driverId===u.id:r.passengerId===u.id);document.getElementById('app').innerHTML=`<div class="head"><div class="brand"><div class="logo">↗</div>KING DRIVER</div><button class="icon" onclick="logout()">↪</button></div><section class="map"><div class="river"></div><div class="street a">Rua Beira Linha</div><div class="street b">Rua Santana</div><div class="street c">Rua São Pedro</div><div class="place p1">Rio das Velhas</div><div class="place p2">Centro</div><div class="place p3">Oeiras</div><div class="mult">1.49x</div><div class="arrow">➤</div>${u.role==='driver'?`<div class="online" onclick="toggleOnline()"><span>${S.online?'ONLINE':'OFFLINE'}</span><div class="dot ${S.online?'':'off'}"></div></div>`:''}<div class="tools"><button class="tool">＋</button><button class="tool">－</button><button class="tool gold">◈</button></div><button class="ride" onclick="newRide()">＋ ${u.role==='driver'?'Corrida':'Solicitar corrida'}</button></section><section class="summary"><h2>Olá, ${esc(u.name.split(' ')[0])}</h2><div class="stats"><div class="stat"><i>🏍</i><div><small>Corridas</small><b>${rs.length}</b></div></div><div class="stat"><i>▣</i><div><small>${u.role==='driver'?'Carteira':'Conta'}</small><b>${u.role==='driver'?money(u.wallet):'Ativa'}</b></div></div></div></section><nav class="tabs"><button class="tab active" onclick="home()">🏍<small>Início</small></button><button class="tab" onclick="rides()">▣<small>Corridas</small></button><button class="tab" onclick="profile()">♙<small>Perfil</small></button>${u.role==='driver'?'<button class="tab" onclick="offers()">☆<small>Ofertas</small></button>':''}</nav>`}
function newRide(){let u=me();if(u.role==='driver'){return driverRegister()}document.getElementById('app').insertAdjacentHTML('beforeend',`<div class="login" id="m"><div class="loginbox"><button class="close" onclick="m.remove()">×</button><h2>Solicitar corrida</h2><div class="field"><label>ORIGEM</label><input id="ro" value="Minha localização"></div><div class="field"><label>DESTINO</label><input id="rd" placeholder="Informe o destino"></div><div class="field"><label>VALOR</label><input id="rf" type="number" value="15.99" min="1" step="0.50"></div><div class="field"><label>PAGAMENTO</label><select id="pay"><option value="pix">PIX — pagamento ao administrador</option><option value="cash">DINHEIRO — motorista precisa ter saldo de 10%</option></select></div><button class="primary" onclick="requestRide()">Solicitar corrida</button></div></div>`)}
function requestRide(){let u=me(),f=Number(rf.value),o=ro.value.trim(),d=rd.value.trim(),payment=pay.value;if(!o||!d||f<=0)return alert('Preencha origem, destino e valor.');let r={id:Date.now(),passengerId:u.id,driverId:null,origin:o,destination:d,fare:f,commission:+(f*.10).toFixed(2),driverAmount:+(f*.90).toFixed(2),payment,status:'requested',paid:false};S.rides.unshift(r);save();m.remove();if(payment==='pix')showPix(r);else home()}
function showPix(r){let key=S.adminPix||'CHAVE-PIX-DO-ADMINISTRADOR';document.getElementById('app').innerHTML=`<div class="panel"><button class="back" onclick="home()">×</button><h2>Pagamento PIX</h2><div class="note">O pagamento é direcionado à <b>conta PIX do administrador</b>. Valor: <b>${money(r.fare)}</b>.</div><div id="qr" class="qr"></div><div class="card"><b>Chave PIX</b><p>${esc(key)}</p><button class="secondary" onclick="navigator.clipboard?.writeText('${esc(key)}');alert('Chave copiada')">Copiar chave</button></div><div class="note">10% da corrida (${money(r.commission)}) pertence à plataforma e 90% (${money(r.driverAmount)}) é a parcela prevista do motorista.</div><button class="primary" onclick="markPaid(${r.id})">Já paguei — confirmar teste</button></div>`;setTimeout(()=>{if(window.QRCode)new QRCode(document.getElementById('qr'),{text:key, width:210,height:210})},50)}function markPaid(id){let r=S.rides.find(x=>x.id===id);if(r){r.paid=true;save();home();alert('Pagamento marcado como recebido. Em produção, a confirmação deve vir do provedor PIX, não do botão.')}}
function offers(){let u=me(),rs=S.rides.filter(r=>r.status==='requested'&&!r.driverId);document.getElementById('app').innerHTML=`<div class="panel"><button class="back" onclick="home()">×</button><h2>Ofertas</h2><div class="note">Corridas em dinheiro só podem ser aceitas se sua carteira tiver pelo menos 10% do valor da corrida.</div>${rs.length?rs.map(r=>`<div class="item"><span class="badge">${r.payment==='cash'?'DINHEIRO':'PIX'}</span><b>${esc(r.origin)}</b><div class="muted">↓ ${esc(r.destination)}</div><div class="price">${money(r.fare)}</div><div class="muted">Sua parcela: ${money(r.driverAmount)} · Comissão: ${money(r.commission)}</div><button class="primary" onclick="accept(${r.id})">Aceitar</button></div>`).join(''):'<div class="card">Nenhuma corrida disponível.</div>'}<button class="secondary" onclick="wallet()">Minha carteira: ${money(u.wallet)}</button></div>`}
function accept(id){let r=S.rides.find(x=>x.id===id),u=me();if(!r||r.driverId)return alert('Corrida indisponível.');if(r.payment==='cash'){if(Number(u.wallet)<r.commission)return alert('Saldo insuficiente. Para aceitar esta corrida em dinheiro, deposite pelo menos '+money(r.commission)+' na carteira.');u.wallet=+(u.wallet-r.commission).toFixed(2);r.commissionCharged=true}else if(!u.pix)return alert('Cadastre sua chave PIX no perfil antes de aceitar corridas PIX.');r.driverId=u.id;r.status='accepted';save();home();alert('Corrida aceita. '+(r.payment==='cash'?'Comissão de '+money(r.commission)+' debitada da carteira.':'Pagamento PIX direcionado ao administrador; repasse de 90% depende do provedor de pagamentos em produção.'))}
function rides(){let u=me(),rs=S.rides.filter(r=>u.role==='driver'?r.driverId===u.id:r.passengerId===u.id);document.getElementById('app').innerHTML=`<div class="panel"><button class="back" onclick="home()">×</button><h2>Minhas corridas</h2>${rs.length?rs.map(r=>`<div class="item"><span class="badge">${r.status} · ${r.payment==='cash'?'DINHEIRO':'PIX'}</span><b>${esc(r.origin)}</b><div class="muted">↓ ${esc(r.destination)}</div><div class="price">${money(r.fare)}</div>${u.role==='driver'?`<div class="muted">Motorista: ${money(r.driverAmount)} · Plataforma 10%: ${money(r.commission)}${r.payment==='cash'?' · comissão debitada da carteira':''}</div>`:''}</div>`).join(''):'<div class="card">Nenhuma corrida.</div>'}</div>`}
function profile(){let u=me();document.getElementById('app').innerHTML=`<div class="panel"><button class="back" onclick="home()">×</button><h2>Meu perfil</h2><div class="card"><b>${esc(u.name)}</b><p class="muted">${esc(u.login)}</p><p>Tipo: <b>${u.role==='driver'?'Motorista':'Passageiro'}</b></p>${u.role==='driver'?`<p>Veículo: ${esc(u.vehicle||'Não informado')}<br>Placa: ${esc(u.plate||'Não informada')}<br>PIX: ${esc(u.pix||'Não cadastrada')}<br>Carteira: <b>${money(u.wallet)}</b></p><button class="primary" onclick="wallet()">Adicionar saldo à carteira (teste)</button>`:''}</div><button class="secondary" onclick="logout()">Sair</button></div>`}
function wallet(){let u=me();document.getElementById('app').innerHTML=`<div class="panel"><button class="back" onclick="home()">×</button><h2>Carteira do motorista</h2><div class="card"><div class="muted">Saldo disponível</div><div class="moneybox">${money(u.wallet)}</div><p class="muted">Para corridas em dinheiro, o app exige saldo suficiente para a comissão de 10%.</p><div class="row"><button class="primary" onclick="addWallet(10)">+ R$ 10</button><button class="primary" onclick="addWallet(50)">+ R$ 50</button></div></div></div>`}function addWallet(v){let u=me();u.wallet=+(Number(u.wallet)+v).toFixed(2);save();wallet();alert('Saldo de teste adicionado. Para dinheiro real, integrar um provedor de pagamentos.')}function driverRegister(){document.getElementById('app').insertAdjacentHTML('beforeend',`<div class="login" id="m"><div class="loginbox"><button class="close" onclick="m.remove()">×</button><h2>Registrar corrida</h2><div class="field"><label>ORIGEM</label><input id="ro" value="Local atual"></div><div class="field"><label>DESTINO</label><input id="rd" placeholder="Destino"></div><div class="field"><label>VALOR</label><input id="rf" type="number" value="15.99"></div><button class="primary" onclick="driverRide()">Registrar corrida concluída</button></div></div>`)}function driverRide(){let u=me(),f=Number(rf.value),r={id:Date.now(),passengerId:null,driverId:u.id,origin:ro.value,destination:rd.value,fare:f,commission:+(f*.1).toFixed(2),driverAmount:+(f*.9).toFixed(2),payment:'cash',status:'completed',paid:true};if(!r.origin||!r.destination||f<=0)return alert('Preencha os dados.');S.rides.unshift(r);u.wallet=Math.max(0,+(u.wallet-r.commission).toFixed(2));save();m.remove();home();alert('Corrida registrada. Comissão de 10%: '+money(r.commission))}function toggleOnline(){S.online=!S.online;save();home()}
function owner(){let total=S.rides.reduce((a,r)=>a+r.commission,0),mov=S.rides.reduce((a,r)=>a+r.fare,0);document.getElementById('app').innerHTML=`<div class="panel"><button class="back" onclick="login()">×</button><h2>👑 Painel do proprietário</h2><div class="card"><div class="muted">Comissão exclusiva — 10%</div><div class="moneybox">${money(total)}</div><div class="muted">${S.rides.length} corrida(s)</div></div><div class="card"><b>PIX da conta administradora</b><div class="field"><input id="opix" value="${esc(S.adminPix)}" placeholder="Sua chave PIX"></div><button class="primary" onclick="saveAdminPix()">Salvar chave PIX</button></div><div class="card"><b>Total movimentado</b><h2>${money(mov)}</h2><b>Sua comissão</b><h2 style="color:var(--g)">${money(total)}</h2></div><div class="card">Passageiros: ${S.users.filter(u=>u.role==='passenger').length}<br>Motoristas: ${S.users.filter(u=>u.role==='driver').length}</div><div class="note"><b>Segurança:</b> este protótipo mantém dados no navegador. Para cobrar PIX e fazer repasse automático real para motoristas, será necessário um backend seguro + provedor de pagamentos com split/marketplace. A chave PIX nunca deve ficar exposta no código.</div><button class="secondary" onclick="logout()">Sair</button></div>`}function saveAdminPix(){S.adminPix=opix.value.trim();save();owner();alert('Chave PIX do administrador salva neste dispositivo.')}
login();</script></body></html>
