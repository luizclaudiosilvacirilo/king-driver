name: Build LC Fábrica de Apps APK

on:
  push:
    branches: [lc-fabrica-android]
    paths:
      - "lc-fabrica-android/**"
      - ".github/workflows/lc-fabrica-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p lc-fabrica-android --no-daemon assembleDebug

      - name: Verify APK exists
        run: test -s lc-fabrica-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LC-Fabrica-de-Apps-1.2.0-debug
          path: lc-fabrica-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
