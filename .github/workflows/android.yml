name: Build King Drive Sabará APK
on:
  push:
    branches: [ main ]
    paths-ignore: [ 'KingDrive-Sabara.apk.b64', 'KingDrive-Sabara.apk.part-*' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KingDrive-Sabara-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK chunks
        shell: bash
        run: |
          base64 -w0 app/build/outputs/apk/debug/app-debug.apk > KingDrive-Sabara.apk.b64
          rm -f KingDrive-Sabara.apk.part-*
          split -b 3500 KingDrive-Sabara.apk.b64 KingDrive-Sabara.apk.part-
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add KingDrive-Sabara.apk.b64 KingDrive-Sabara.apk.part-*
          git commit -m "Publish King Drive Sabará APK chunks" || true
          git push
