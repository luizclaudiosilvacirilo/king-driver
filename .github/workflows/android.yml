name: Build LC Fabrica de Apps APK
on:
  push:
    branches: [ lc-fabrica-android ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK
        run: gradle -p lc-fabrica-android --no-daemon clean assembleRelease
      - name: Verify APK package, label and version
        shell: bash
        run: |
          set -euo pipefail
          APK=lc-fabrica-android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          unzip -t "$APK"
          BADGING="$($ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='br.com.lcfabrica.apps'"
          echo "$BADGING" | grep -F "versionName='1.2.6'"
          echo "$BADGING" | grep -F "application-label:'LC Fábrica de Apps'"
      - name: Generate temporary test signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/lc-test-signing.jks" -storepass testonly123 -keypass testonly123 -alias lc-test -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=LC Fabrica Test,O=LC,C=BR"
      - name: Align and sign APK
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED=lc-fabrica-android/app/build/outputs/apk/release/app-release-unsigned.apk
          SIGNED=lc-fabrica-android/app/build/outputs/apk/release/LC-Fabrica-de-Apps-1.2.6-test.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/lc-test-signing.jks" --ks-key-alias lc-test --ks-pass pass:testonly123 --key-pass pass:testonly123 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out "$SIGNED" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$SIGNED"
          unzip -t "$SIGNED"
          cp "$SIGNED" "$RUNNER_TEMP/LC-Fabrica-de-Apps-1.2.6-test.apk"
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: LC-Fabrica-de-Apps-1.2.6-test-signed
          path: ${{ runner.temp }}/LC-Fabrica-de-Apps-1.2.6-test.apk
          if-no-files-found: error
          retention-days: 30
