name: Build LC Fabrica de Apps APK
on:
  push:
    branches: [ lc-fabrica-android ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build LC Fabrica Android project
        run: gradle -p lc-fabrica-android --no-daemon assembleDebug
      - name: Verify APK identity and output
        run: |
          test -s lc-fabrica-android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t lc-fabrica-android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LC-Fabrica-de-Apps-1.2.1-debug
          path: lc-fabrica-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
