name: Build LC Finanças APK
on:
  workflow_dispatch:
  push:
    branches:
      - lc-financas-apk-build
    paths:
      - 'lc-financas-android/**'
      - '.github/workflows/lc-financas-apk.yml'
permissions:
  contents: read
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build installable APK
        working-directory: lc-financas-android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LC-Financas-1.2.3-logo-corrigida
          path: lc-financas-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
