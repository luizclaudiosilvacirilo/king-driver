name: Build LC Finanças signed APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'lc-financas-android/**'
      - '.github/workflows/lc-financas-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare private release signing key
        working-directory: lc-financas-android
        env:
          LC_UPLOAD_KEYSTORE_BASE64: ${{ secrets.LC_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$LC_UPLOAD_KEYSTORE_BASE64" || (echo "Missing GitHub Actions secret LC_UPLOAD_KEYSTORE_BASE64" && exit 1)
          echo "$LC_UPLOAD_KEYSTORE_BASE64" | base64 --decode > app/upload-key.jks
          chmod 600 app/upload-key.jks
      - name: Build signed release APK
        working-directory: lc-financas-android
        env:
          LC_KEYSTORE_PATH: app/upload-key.jks
          LC_UPLOAD_STORE_PASSWORD: ${{ secrets.LC_UPLOAD_STORE_PASSWORD }}
          LC_UPLOAD_KEY_ALIAS: ${{ secrets.LC_UPLOAD_KEY_ALIAS }}
          LC_UPLOAD_KEY_PASSWORD: ${{ secrets.LC_UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$LC_UPLOAD_STORE_PASSWORD"
          test -n "$LC_UPLOAD_KEY_ALIAS"
          test -n "$LC_UPLOAD_KEY_PASSWORD"
          gradle --no-daemon assembleRelease
      - name: Verify APK signature
        working-directory: lc-financas-android
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: LC-Financas-1.2.2-release-signed
          path: lc-financas-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
