plugins { id 'com.android.application' }

android {
    namespace 'br.com.lcfinances.app'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.lcfinances.app.novo'
        minSdk 23
        targetSdk 35
        versionCode 15
        versionName '1.2.3'
    }

    signingConfigs {
        release {
            def ks = System.getenv('LC_KEYSTORE_PATH')
            storeFile file(ks ?: 'upload-key.jks')
            storePassword System.getenv('LC_UPLOAD_STORE_PASSWORD')
            keyAlias System.getenv('LC_UPLOAD_KEY_ALIAS')
            keyPassword System.getenv('LC_UPLOAD_KEY_PASSWORD')
        }
    }

    buildTypes {
        debug { }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
