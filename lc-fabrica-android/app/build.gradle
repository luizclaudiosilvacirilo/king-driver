plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'br.com.lcfabrica.apps'
    compileSdk 35

    defaultConfig {
        // ID novo para permitir instalação limpa, sem conflito com APKs de testes
        // anteriores assinados por chaves temporárias diferentes.
        applicationId 'br.com.lcfabrica.apps.instalacao126'
        minSdk 23
        targetSdk 35
        versionCode 7
        versionName '1.2.7'
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
