<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>King Driver — Administração</title><style>body{margin:0;background:#090909;color:#fff;font-family:system-ui}.app{max-width:900px;margin:auto;padding:20px}.brand{text-align:center;font-size:28px;font-weight:900;margin:12px}.brand span{color:#d4af37}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.card{background:#151515;border:1px solid #292929;border-radius:16px;padding:16px;margin:12px 0}button{padding:11px 14px;border-radius:10px;border:1px solid #333;background:#0d0d0d;color:#fff;font-weight:800;cursor:pointer}.gold{background:#d4af37;color:#111;border:0}.danger{background:#3b1818;color:#ff9999}.muted{color:#aaa;font-size:13px}.stat{font-size:30px;font-weight:900;color:#d4af37}.row{border:1px solid #333;border-radius:12px;padding:12px;margin:8px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.actions button{flex:1}</style></head><body><div class="app"><div class="brand">♛ KING <span>DRIVER</span></div><div id="root"><div class="card">Carregando painel...</div></div></div><script type="module">
import './js/config.js';
const U=window.KING_DRIVER_SUPABASE_URL,K=window.KING_DRIVER_SUPABASE_PUBLISHABLE_KEY,T=()=>sessionStorage.getItem('king_driver_access_token')||'';const root=document.getElementById('root');
async function api(path,opt={}){const token=T();if(!token)throw Error('Sessão expirada.');const r=await fetch(U+path,{...opt,headers:{apikey:K,Authorization:`Bearer ${token}`,'Content-Type':'application/json',...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||d.msg||d.error_description||'Erro no servidor');return d}
function uid(){try{const p=T().split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(atob(p)).sub||''}catch(_){return ''}}
async function init(){try{const p=(await api('/rest/v1/profiles?select=*&id=eq.'+uid()))[0];if(!p||p.role!=='admin')throw Error('Acesso restrito ao proprietário/admin.');render();await load()}catch(e){root.innerHTML='<div class="card">'+e.message+'<button onclick="location.href=\'index.html\'">Voltar</button></div>'}}
function render(){root.innerHTML='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div><b>Painel do proprietário</b><div class="muted">Controle operacional do King Driver</div></div><button onclick="logout()">Sair</button></div></div><div id="stats" class="grid"></div><div class="card"><h2>Motoristas pendentes</h2><div id="drivers"></div></div><div class="card"><h2>Corridas recentes</h2><div id="rides"></div></div>'}
async function load(){const [drivers,rides,users]=await Promise.all([api('/rest/v1/driver_profiles?select=id,license_number,status,verified,created_at&order=created_at.desc&limit=50'),api('/rest/v1/rides?select=*&order=created_at.desc&limit=50'),api('/rest/v1/profiles?select=id,full_name,phone,role,created_at&order=created_at.desc&limit=100')]);const active=drivers.filter(d=>d.status==='active'&&d.verified).length;const pending=drivers.filter(d=>d.status==='pending'||!d.verified).length;document.getElementById('stats').innerHTML=[['Usuários',users.length],['Motoristas',drivers.length],['Pendentes',pending],['Corridas',rides.length],['Concluídas',rides.filter(r=>r.status==='completed').length]].map(x=>'<div class="card"><div class="muted">'+x[0]+'</div><div class="stat">'+x[1]+'</div></div>').join('');const names=Object.fromEntries(users.map(u=>[u.id,u.full_name||u.phone||u.id.slice(0,8)]));document.getElementById('drivers').innerHTML=drivers.length?drivers.map(d=>'<div class="row"><b>'+escape(names[d.id]||d.id)+'</b><div class="muted">CNH: '+escape(d.license_number||'não informada')+' · '+d.status+' · '+(d.verified?'verificado':'não verificado')+'</div><div class="actions">'+((d.status!=='active'||!d.verified)?'<button class="gold" onclick="approve(\''+d.id+'\')">Aprovar motorista</button>':'<button class="danger" onclick="suspend(\''+d.id+'\')">Suspender</button>')+'</div></div>').join(''):'<div class="muted">Nenhum motorista cadastrado.</div>';document.getElementById('rides').innerHTML=rides.length?rides.map(r=>'<div class="row"><b>'+escape(r.pickup_address)+' → '+escape(r.destination_address)+'</b><div class="muted">'+r.status+' · R$ '+Number(r.final_fare??r.offered_fare??0).toFixed(2)+'</div></div>').join(''):'<div class="muted">Nenhuma corrida.</div>'}
async function approve(id){try{await api('/rest/v1/rpc/admin_set_driver_status',{method:'POST',body:JSON.stringify({p_driver_id:id,p_status:'active',p_verified:true})});await load()}catch(e){alert(e.message)}}async function suspend(id){try{await api('/rest/v1/rpc/admin_set_driver_status',{method:'POST',body:JSON.stringify({p_driver_id:id,p_status:'suspended',p_verified:false})});await load()}catch(e){alert(e.message)}}function escape(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}window.approve=approve;window.suspend=suspend;window.logout=()=>{sessionStorage.clear();location.href='auth.html'};init();
</script></body></html>
