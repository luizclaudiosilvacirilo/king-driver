<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6a000"><title>King Driver — Sabará</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f2ed;color:#171717}*{box-sizing:border-box}body{margin:0}.app{max-width:560px;margin:auto;min-height:100vh;background:#f4f2ed}.top{background:#111;color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.logo{width:44px;height:44px;border-radius:13px;background:#f6a000;display:grid;place-items:center;font-size:23px}.pill{font-size:11px;background:#2b2b2b;border-radius:99px;padding:7px 10px}.hero{padding:18px;background:linear-gradient(150deg,#fff7df,#fff)}.hero h1{margin:0 0 5px;font-size:27px}.muted{color:#777;font-size:12px}.card{background:#fff;margin:12px;padding:16px;border-radius:18px;box-shadow:0 3px 14px #0000000b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{margin:9px 0}.field label{display:block;font-size:11px;font-weight:900;color:#666;margin-bottom:4px}.field input,.field select{width:100%;padding:13px;border:1px solid #ddd;border-radius:11px;background:#fff}.btn{width:100%;padding:13px;border:0;border-radius:12px;background:#f6a000;color:#fff;font-weight:900;margin-top:8px}.btn.alt{background:#eee;color:#222}.ride{border:1px solid #eee;border-radius:14px;padding:13px;margin:9px 0}.status{display:inline-block;margin-top:6px;padding:5px 8px;border-radius:99px;background:#f2f2f2;font-size:10px;font-weight:900}.fare{font-size:22px;color:#c57e00;font-weight:900;margin-top:6px}.tabs{position:sticky;bottom:0;display:grid;grid-template-columns:1fr 1fr 1fr;background:#fff;border-top:1px solid #ddd}.tabs button{border:0;background:#fff;padding:13px;font-weight:900}.tabs button.active{color:#c57e00}.msg{padding:10px;border-radius:10px;background:#fff8e8;font-size:12px;margin-top:8px}.ok{color:#159447}.warn{color:#b66d00}.err{color:#b52c24}</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">K</div><div>King Driver<div class="muted" style="color:#ddd">Sabará • Minas Gerais</div></div></div><div id="rolePill" class="pill">...</div></header><section class="hero"><h1 id="hello">King Driver Sabará</h1><div id="sub" class="muted">Conectando ao sistema...</div></section><main id="content"></main><nav class="tabs"><button id="homeTab" class="active">Início</button><button id="ridesTab">Corridas</button><button id="profileTab">Perfil</button></nav></div><script type="module">import './js/config.js';const URL=window.KING_DRIVER_SUPABASE_URL,KEY=window.KING_DRIVER_SUPABASE_PUBLISHABLE_KEY,TK='king_driver_access_token';const token=()=>sessionStorage.getItem(TK)||'';const uid=t=>{try{const p=t.split('.')[1]?.replace(/-/g,'+').replace(/_/g,'/');return p?JSON.parse(atob(p)).sub:''}catch(_){return''}};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,opt={}){const t=token();if(!t){location.href='auth.html';throw Error('Faça login para continuar.')}const r=await fetch(URL+path,{...opt,headers:{apikey:KEY,Authorization:`Bearer ${t}`,'Content-Type':'application/json',...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||d.msg||d.error_description||'Erro na operação.');return d}let profile=null,rides=[],mode='home';const content=document.getElementById('content');const money=n=>'R$ '+Number(n||0).toFixed(2).replace('.',',');function tabs(active){['homeTab','ridesTab','profileTab'].forEach(id=>document.getElementById(id).classList.toggle('active',id===active+'Tab'))}function renderHome(){tabs('home');const driver=profile.role==='driver';content.innerHTML=`<section class="card"><h2>${driver?'Central do motorista':'Solicitar corrida'}</h2>${driver?`<p class="muted">${profile.approved?'Motorista aprovado e apto a receber solicitações.':'Cadastro recebido. Aguarde aprovação administrativa para aceitar corridas.'}</p><button class="btn" id="refresh">Atualizar solicitações</button>`:`<div class="field"><label>ORIGEM</label><input id="origin" placeholder="Ex.: Centro de Sabará"></div><div class="field"><label>DESTINO</label><input id="destination" placeholder="Informe o destino"></div><div class="grid"><div class="field"><label>CATEGORIA</label><select id="category"><option value="economy">Econômico</option><option value="comfort">Conforto</option><option value="premium">Premium</option></select></div><div class="field"><label>VALOR OFERTADO</label><input id="fare" type="number" min="1" step="0.50" value="18.50"></div></div><button class="btn" id="request">Solicitar corrida</button>`}</section><section class="card"><h3>${driver?'Corridas disponíveis':'Minhas corridas'}</h3><div id="list"></div></section>`;if(driver)document.getElementById('refresh').onclick=load;else document.getElementById('request').onclick=requestRide;paint()}function renderRides(){tabs('rides');content.innerHTML='<section class="card"><h2>Corridas</h2><div id="list"></div></section>';paint()}function renderProfile(){tabs('profile');content.innerHTML=`<section class="card"><h2>Meu perfil</h2><p><b>Nome:</b> ${esc(profile.full_name||'—')}</p><p><b>Perfil:</b> ${profile.role==='driver'?'Motorista':'Passageiro'}</p>${profile.role==='driver'?`<p><b>Aprovação:</b> <span class="${profile.approved?'ok':'warn'}">${profile.approved?'Aprovado':'Pendente'}</span></p>`:''}<button class="btn alt" id="logout">Sair</button></section>`;document.getElementById('logout').onclick=()=>{sessionStorage.clear();location.href='auth.html'}}function paint(){const list=document.getElementById('list');if(!list)return;if(!rides.length){list.innerHTML='<div class="muted">Nenhuma corrida encontrada.</div>';return}list.innerHTML=rides.map(r=>{let action='';if(profile.role==='driver'&&r.status==='requested'&&profile.approved)action=`<button class="btn" data-a="${r.id}">Aceitar corrida</button>`;if(profile.role==='passenger'&&r.status==='requested')action=`<button class="btn alt" data-s="${r.id}" data-n="cancelled">Cancelar</button>`;if(profile.role==='driver'&&r.driver_id===profile.id&&r.status==='accepted')action=`<button class="btn" data-s="${r.id}" data-n="arriving">Estou a caminho</button>`;if(profile.role==='driver'&&r.driver_id===profile.id&&r.status==='arriving')action=`<button class="btn" data-s="${r.id}" data-n="in_progress">Iniciar corrida</button>`;if(profile.role==='driver'&&r.driver_id===profile.id&&r.status==='in_progress')action=`<button class="btn" data-s="${r.id}" data-n="completed">Finalizar corrida</button>`;return`<div class="ride"><b>${esc(r.pickup_address)}</b> → <b>${esc(r.destination_address)}</b><div class="muted">${esc(r.category)} · ${esc(r.requested_at||'')}</div><div class="fare">${money(r.final_fare??r.offered_fare)}</div><span class="status">${esc(r.status)}</span>${action}</div>`}).join('');document.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{try{await api('/rest/v1/rpc/accept_ride',{method:'POST',body:JSON.stringify({p_ride_id:b.dataset.a})});await load()}catch(e){alert(e.message)}});document.querySelectorAll('[data-s]').forEach(b=>b.onclick=async()=>{try{await api('/rest/v1/rpc/update_ride_status',{method:'POST',body:JSON.stringify({p_ride_id:b.dataset.s,p_status:b.dataset.n})});await load()}catch(e){alert(e.message)}})}async function load(){const q=profile.role==='driver'?'/rest/v1/rides?select=*&status=eq.requested&order=requested_at.desc&limit=20':`/rest/v1/rides?select=*&passenger_id=eq.${encodeURIComponent(profile.id)}&order=created_at.desc&limit=20`;try{rides=await api(q);mode==='home'?renderHome():renderRides()}catch(e){content.innerHTML=`<section class="card"><div class="err">${esc(e.message)}</div></section>`}}async function requestRide(){const o=document.getElementById('origin').value.trim(),d=document.getElementById('destination').value.trim(),c=document.getElementById('category').value,f=Number(document.getElementById('fare').value);if(!o||!d||f<=0)return alert('Preencha origem, destino e valor.');try{await api('/rest/v1/rides',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({passenger_id:profile.id,pickup_address:o,destination_address:d,category:c,offered_fare:f,status:'requested'})});await load()}catch(e){alert(e.message)}}async function init(){const t=token();if(!t)return location.href='auth.html';const id=uid(t);if(!id)return location.href='auth.html';try{const p=(await api(`/rest/v1/profiles?select=id,full_name,phone,role&id=eq.${encodeURIComponent(id)}&limit=1`))[0];if(!p)throw Error('Perfil não encontrado.');profile={...p,approved:false};if(p.role==='driver'){const d=(await api(`/rest/v1/driver_profiles?select=status,verified&id=eq.${encodeURIComponent(id)}&limit=1`))[0];profile.approved=!!(d&&d.status==='active'&&d.verified)}document.getElementById('hello').textContent='Olá, '+(p.full_name||'usuário').split(' ')[0];document.getElementById('sub').textContent='Sistema conectado';document.getElementById('rolePill').textContent=p.role==='driver'?'MOTORISTA':'PASSAGEIRO';await load()}catch(e){content.innerHTML=`<section class="card"><div class="err">${esc(e.message)}</div></section>`}}document.getElementById('homeTab').onclick=()=>{mode='home';renderHome();load()};document.getElementById('ridesTab').onclick=()=>{mode='rides';renderRides();load()};document.getElementById('profileTab').onclick=()=>{mode='profile';renderProfile()};init();</script></body></html>
